  schemas:
    DomainEventPayload:
      type: object
      required: [eventType, aggregateType, aggregateId, payloadJson]
      properties:
        eventType:
          type: string
          description: >
            Sin convención de nombres única — PascalCase (mayoría) o dot.case
            (authz.break_glass.activated, periop.case.confirmation_blocked).
            Ver docs/events/event-catalog.md para el catálogo completo.
        aggregateType:
          type: string
          description: Tipo del agregado que originó el evento (p. ej. "orders").
        aggregateId:
          type: string
          format: uuid
        payloadJson:
          type: object
          additionalProperties: true
          description: >
            Sin JSON Schema validado por tipo de evento en código
            (Record<string, unknown> en TypeScript) — objeto genérico aquí a
            propósito, no se fabrica un schema por evento sin evidencia.

    # Estructura de infraestructura (F1)
    StructureEventEnvelope:
      type: object
      description: Campos del envelope que acompañan a todo evento de estructura.
      required: [eventType, aggregateType, aggregateId, tenantId, actorUserId]
      properties:
        eventType:
          type: string
        aggregateType:
          type: string
        aggregateId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        correlationId:
          type: string
          description: Es el `correlationId` de la petición HTTP que originó el cambio (el mismo que ven los errores).
