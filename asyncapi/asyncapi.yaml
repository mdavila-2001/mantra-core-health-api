asyncapi: 3.1.0
info:
  title: ALOVIDA Health API — Eventos de dominio y colas
  version: "0.0.1"
  description: >
    Catálogo de eventos de dominio y colas de trabajo del backend ALOVIDA Health.
    El mecanismo real es un outbox transaccional propio sobre PostgreSQL
    (módulo `messaging`, ver docs/events/overview.md), no un broker de mensajería
    dedicado (Kafka/RabbitMQ) — ver ADR-0007 y ADR-0019. Los "canales" HTTP
    /internal/* descritos aquí son el mecanismo real de publicación/reclamo/entrega,
    no un protocolo de mensajería estándar.
  license:
    name: UNLICENSED

defaultContentType: application/json

servers:
  local:
    host: localhost:3000
    protocol: http
    description: >
      No hay broker de mensajería como servidor independiente — el "servidor" de
      estos canales es la propia API HTTP (endpoints /internal/*), autenticados con
      JWT de servicio.

channels:
  domainEvents:
    address: /internal/events/{domainEventId}/dispatch
    description: >
      Despacho de un evento de dominio ya publicado en el outbox hacia sus
      suscriptores activos (event_subscriptions). UC-35-03.
    parameters:
      domainEventId:
        description: Identificador del evento en `messaging.domain_events`.
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'
      practiceStructureEvent:
        $ref: '#/components/messages/PracticeStructureEvent'
      infrastructureOpsEvent:
        $ref: '#/components/messages/InfrastructureOpsEvent'
      adtEvent:
        $ref: '#/components/messages/AdtEvent'

  outboxRelay:
    address: /internal/outbox/relay/run
    description: >
      Reclama (FOR UPDATE SKIP LOCKED) y publica mensajes pendientes del outbox.
      UC-35-02.
    messages:
      outboxMessage:
        $ref: '#/components/messages/OutboxMessage'

  queueJobs:
    address: /internal/queues/{code}/claim
    description: >
      Reclamo de jobs de una cola de trabajo genérica (SKIP LOCKED + visibility
      timeout). UC-35-06.
    parameters:
      code:
        description: Código de `messaging.message_queues` (ver MESSAGING_QUEUE_CODES).
    messages:
      queuedJob:
        $ref: '#/components/messages/QueuedJob'

  eventDeliveryAck:
    address: /internal/event-deliveries/{id}/ack
    description: Acuse de un consumidor sobre una entrega de evento. UC-35-04.
    parameters:
      id:
        description: Identificador de `messaging.event_deliveries`.
    messages:
      deliveryAck:
        $ref: '#/components/messages/DeliveryAck'

  providerWebhookReceipt:
    address: /webhooks/providers/{providerCode}/receipts
    description: >
      Acuse de entrega enviado por un proveedor externo de canal (SMS/email/push),
      autenticado por firma (no JWT). UC-35-12. Único canal de este documento con
      un productor externo al propio backend.
    parameters:
      providerCode:
        description: Código del proveedor de mensajería/canal externo.
    messages:
      providerReceipt:
        $ref: '#/components/messages/ProviderReceipt'

operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    summary: >
      Un módulo de negocio publica un evento de dominio dentro de su propia
      transacción (OutboxService.publishDomainEvent — sin endpoint HTTP propio,
      UC-35-01 es interno).

  dispatchEvent:
    action: receive
    channel:
      $ref: '#/channels/domainEvents'
    summary: worker-messaging despacha el evento a cada suscripción que coincide con el filtro.

  relayOutbox:
    action: send
    channel:
      $ref: '#/channels/outboxRelay'
    summary: worker-messaging reclama y publica mensajes pendientes del outbox.

  claimQueueJob:
    action: receive
    channel:
      $ref: '#/channels/queueJobs'
    summary: Cualquiera de los 17 workers reclama trabajo pendiente de su cola.

  ackDelivery:
    action: send
    channel:
      $ref: '#/channels/eventDeliveryAck'
    summary: Un consumidor confirma que procesó una entrega.

  receiveProviderReceipt:
    action: receive
    channel:
      $ref: '#/channels/providerWebhookReceipt'
    summary: Un proveedor externo confirma el estado final de una notificación enviada.

components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: Evento de dominio
      summary: >
        Envelope real de messaging.domain_events. Ver docs/events/event-catalog.md
        para los 79 valores reales de eventType observados en código (79 sitios de
        publishDomainEvent en 10 módulos productores).
      payload:
        $ref: '#/components/schemas/DomainEventPayload'

    PracticeStructureEvent:
      name: PracticeStructureEvent
      title: Evento de estructura del establecimiento (practice, F1)
      summary: >
        Cambios del árbol físico (care_spaces), del árbol organizativo
        (clinical_units), de las habilitaciones (fachada sobre
        organization_extensions.facility_licenses) y de los datos regulatorios
        de la sede. Se publican en la misma transacción que el cambio
        (src/modules/practice/services/structure-events.ts). El payload lleva
        ids, códigos y la rowVersion resultante; nunca texto libre (el motivo
        de un cambio de ciclo de vida queda en audit.*_history, el evento sólo
        dice reasonProvided).
      payload:
        $ref: '#/components/schemas/PracticeStructureEventPayload'

    InfrastructureOpsEvent:
      name: InfrastructureOpsEvent
      title: Operación de espacios (practice, F2)
      summary: >
        Cambios de los ejes operativos de un espacio (disponibilidad, higiene,
        aislamiento, ocupación derivada), bloqueos y órdenes de limpieza
        (CONTRATO-F2-F5 §F2.3). Se publican en la misma transacción que el
        cambio (src/modules/practice/services/ops/ops-events.ts).
        `practice.care_space.status_changed` equivale a HL7 ADT^A20 / NPU y su
        payload lleva careSpaceId, siteId, axis, from, to, v2Code (HL7 v2-0116),
        reasonCode, reasonText, expectedUntil, source, sourceRefId, occurredAt,
        requestId y opsVersion. Las órdenes de limpieza nunca llevan datos de
        paciente.
      payload:
        $ref: '#/components/schemas/InfrastructureOpsEventPayload'

    AdtEvent:
      name: AdtEvent
      title: Internación / ADT y censo (clinical, F3)
      summary: >
        Movimientos de internación equivalentes a HL7 ADT (A01 ingreso/asignación,
        A02 traslado con PV1-3 y PV1-6, A17 intercambio, A03 egreso, A12 anulación de
        traslado), forzados de compatibilidad, revisión de incidentes y cierre/ajuste
        del censo diario (CONTRATO-F2-F5 §F3.3). Se publican en la misma transacción
        (src/modules/clinical/services/inpatient/adt-support.ts). El payload lleva ids
        (encuentro, ubicación, cama), el código HL7 y el requestId; nunca datos del
        paciente. Cada movimiento de cama publica además
        practice.care_space.status_changed (eje OCCUPANCY) por CareSpaceOpsPort.
      payload:
        $ref: '#/components/schemas/AdtEventPayload'

    OutboxMessage:
      name: OutboxMessage
      title: Mensaje de outbox
      summary: Estado de publicación de un domain event (pending → published | failed).
      payload:
        type: object
        properties:
          outboxMessageId:
            type: string
            format: uuid
          domainEventId:
            type: string
            format: uuid
          status:
            type: string
            enum: [pending, published, failed]
          attempts:
            type: integer

    QueuedJob:
      name: QueuedJob
      title: Job de cola
      summary: Job genérico reclamado con SKIP LOCKED + visibility timeout.
      payload:
        type: object
        properties:
          jobId:
            type: string
            format: uuid
          queueCode:
            type: string
          status:
            type: string
            enum: [ready, running, succeeded, dead_letter]
          attempts:
            type: integer
          payload:
            type: object
            description: >
              Sin JSON Schema fijo — cada cola define su propia forma de payload
              (ver docs/events/event-catalog.md §"Esquema de payload — no tipado por evento").

    DeliveryAck:
      name: DeliveryAck
      title: Acuse de entrega
      payload:
        type: object
        properties:
          eventDeliveryId:
            type: string
            format: uuid
          acknowledgedAt:
            type: string
            format: date-time

    ProviderReceipt:
      name: ProviderReceipt
      title: Acuse de proveedor externo
      summary: Autenticado por firma (verifySignature), fail-closed ante firma inválida.
      payload:
        type: object
        properties:
          signature:
            type: string
          status:
            type: string
            enum: [delivered, bounced]

  schemas:
    DomainEventPayload:
      type: object
      required: [eventType, aggregateType, aggregateId, payloadJson]
      properties:
        eventType:
          type: string
          description: >
            Sin convención de nombres única — PascalCase (mayoría) o dot.case
            (authz.break_glass.activated, periop.case.confirmation_blocked).
            Ver docs/events/event-catalog.md para el catálogo completo.
        aggregateType:
          type: string
          description: Tipo del agregado que originó el evento (p. ej. "orders").
        aggregateId:
          type: string
          format: uuid
        payloadJson:
          type: object
          additionalProperties: true
          description: >
            Sin JSON Schema validado por tipo de evento en código
            (Record<string, unknown> en TypeScript) — objeto genérico aquí a
            propósito, no se fabrica un schema por evento sin evidencia.

    PracticeStructureEventPayload:
      type: object
      required: [eventType, aggregateType, aggregateId, payloadJson]
      properties:
        eventType:
          type: string
          enum:
            - practice.care_space.created
            - practice.care_space.updated
            - practice.care_space.moved
            - practice.care_space.lifecycle_changed
            - practice.clinical_unit.created
            - practice.clinical_unit.updated
            - practice.clinical_unit.lifecycle_changed
            - practice.site_license.created
            - practice.site_license.updated
            - practice.site.regulatory_updated
            - practice.site.snis_verified
            - practice.site.capacity_declared
        aggregateType:
          type: string
          enum:
            - practice.care_spaces
            - practice.clinical_units
            - organization_extensions.facility_licenses
            - practice.practice_sites
        aggregateId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        payloadJson:
          type: object
          additionalProperties: true
          description: >
            Siempre `siteId`; según el evento, `spaceId`/`unitId`/`licenseId`,
            `changes` (campos tocados), `parentId`/`fromParentId`/`toParentId`,
            `action`/`from`/`to`/`reasonProvided` (ciclo de vida),
            `assignmentId`/`op`/`roleCode` (vínculos espacio↔unidad),
            `code`/`formCode`/`functionCode`/`statusCode` (altas) y
            `rowVersion`.
          properties:
            siteId:
              type: string
              format: uuid
            rowVersion:
              type: integer

    InfrastructureOpsEventPayload:
      type: object
      required: [eventType, aggregateType, aggregateId, payloadJson]
      properties:
        eventType:
          type: string
          enum:
            - practice.care_space.status_changed
            - practice.care_space.block_started
            - practice.care_space.block_ended
            - practice.care_space.block_cancelled
            - practice.care_space.block_overdue
            - practice.cleaning_order.created
            - practice.cleaning_order.assigned
            - practice.cleaning_order.started
            - practice.cleaning_order.finished
            - practice.cleaning_order.inspected
            - practice.cleaning_order.rejected
            - practice.cleaning_order.cancelled
        aggregateType:
          type: string
          enum:
            - practice.care_spaces
            - practice.care_space_blocks
            - practice.cleaning_orders
        aggregateId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        payloadJson:
          type: object
          additionalProperties: true
          properties:
            careSpaceId:
              type: string
              format: uuid
            siteId:
              type: string
              format: uuid
            axis:
              type: string
              enum: [AVAILABILITY, HYGIENE, ISOLATION, OCCUPANCY]
            v2Code:
              type: string
              enum: [C, H, I, K, O, U, R]
            requestId:
              type: string

    AdtEventPayload:
      type: object
      required: [eventType, aggregateType, aggregateId, payloadJson]
      properties:
        eventType:
          type: string
          enum:
            - clinical.adt.admitted
            - clinical.adt.bed_assigned
            - clinical.adt.reservation_created
            - clinical.adt.transferred
            - clinical.adt.swapped
            - clinical.adt.discharged
            - clinical.adt.reservation_cancelled
            - clinical.adt.transfer_cancelled
            - clinical.adt.placement_override
            - clinical.adt.placement_incident_reviewed
            - clinical.census_day.closed
            - clinical.census_day.adjusted
        aggregateType:
          type: string
          enum:
            - clinical.encounters
            - clinical.placement_incidents
            - clinical.inpatient_census_days
        aggregateId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        payloadJson:
          type: object
          additionalProperties: true
          properties:
            encounterId:
              type: string
              format: uuid
            hl7:
              type: string
              enum: [A01, A02, A03, A12, A17]
            requestId:
              type: string
