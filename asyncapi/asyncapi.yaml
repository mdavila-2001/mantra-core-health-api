asyncapi: 3.1.0

info:
  title: ALOVIDA Health API — Eventos de dominio y colas
  version: "0.0.1"
  description: >
    Catálogo de eventos de dominio y colas de trabajo del backend ALOVIDA Health.
    El mecanismo real es un outbox transaccional propio sobre PostgreSQL
    (módulo `messaging`, ver docs/events/overview.md), no un broker de mensajería
    dedicado (Kafka/RabbitMQ) — ver ADR-0007 y ADR-0019. Los "canales" HTTP
    /internal/* descritos aquí son el mecanismo real de publicación/reclamo/entrega,
    no un protocolo de mensajería estándar.
  license:
    name: UNLICENSED

defaultContentType: application/json

servers:
  local:
    host: localhost:3000
    protocol: http
    description: >
      No hay broker de mensajería como servidor independiente — el "servidor" de
      estos canales es la propia API HTTP (endpoints /internal/*), autenticados con
      JWT de servicio.

channels:
  domainEvents:
    address: /internal/events/{domainEventId}/dispatch
    description: >
      Despacho de un evento de dominio ya publicado en el outbox hacia sus
      suscriptores activos (event_subscriptions). UC-35-03.
    parameters:
      domainEventId:
        description: Identificador del evento en `messaging.domain_events`.
    messages:
      domainEvent:
        $ref: '#/components/messages/DomainEvent'

  outboxRelay:
    address: /internal/outbox/relay/run
    description: >
      Reclama (FOR UPDATE SKIP LOCKED) y publica mensajes pendientes del outbox.
      UC-35-02.
    messages:
      outboxMessage:
        $ref: '#/components/messages/OutboxMessage'

  queueJobs:
    address: /internal/queues/{code}/claim
    description: >
      Reclamo de jobs de una cola de trabajo genérica (SKIP LOCKED + visibility
      timeout). UC-35-06.
    parameters:
      code:
        description: Código de `messaging.message_queues` (ver MESSAGING_QUEUE_CODES).
    messages:
      queuedJob:
        $ref: '#/components/messages/QueuedJob'

  eventDeliveryAck:
    address: /internal/event-deliveries/{id}/ack
    description: Acuse de un consumidor sobre una entrega de evento. UC-35-04.
    parameters:
      id:
        description: Identificador de `messaging.event_deliveries`.
    messages:
      deliveryAck:
        $ref: '#/components/messages/DeliveryAck'

  providerWebhookReceipt:
    address: /webhooks/providers/{providerCode}/receipts
    description: >
      Acuse de entrega enviado por un proveedor externo de canal (SMS/email/push),
      autenticado por firma (no JWT). UC-35-12. Único canal de este documento con
      un productor externo al propio backend.
    parameters:
      providerCode:
        description: Código del proveedor de mensajería/canal externo.
    messages:
      providerReceipt:
        $ref: '#/components/messages/ProviderReceipt'

  # Estructura de infraestructura (F1)
  practiceStructureEvents:
    address: practice.structure
    description: >
      Hechos de la estructura de infraestructura. El envelope real es
      `messaging.domain_events` (eventType, aggregateType, aggregateId, payloadJson);
      aquí se describe el `payloadJson` de cada `eventType` dot.case.
    messages:
      CareSpaceCreated:
        $ref: '#/components/messages/CareSpaceCreated'
      CareSpaceUpdated:
        $ref: '#/components/messages/CareSpaceUpdated'
      CareSpaceMoved:
        $ref: '#/components/messages/CareSpaceMoved'
      CareSpaceLifecycleChanged:
        $ref: '#/components/messages/CareSpaceLifecycleChanged'
      ClinicalUnitCreated:
        $ref: '#/components/messages/ClinicalUnitCreated'
      ClinicalUnitUpdated:
        $ref: '#/components/messages/ClinicalUnitUpdated'
      ClinicalUnitLifecycleChanged:
        $ref: '#/components/messages/ClinicalUnitLifecycleChanged'
      SpaceUnitAssignmentCreated:
        $ref: '#/components/messages/SpaceUnitAssignmentCreated'
      SpaceUnitAssignmentClosed:
        $ref: '#/components/messages/SpaceUnitAssignmentClosed'
      SiteRegulatoryUpdated:
        $ref: '#/components/messages/SiteRegulatoryUpdated'
      SiteSnisVerified:
        $ref: '#/components/messages/SiteSnisVerified'
      SiteLicenseCreated:
        $ref: '#/components/messages/SiteLicenseCreated'
      SiteLicenseUpdated:
        $ref: '#/components/messages/SiteLicenseUpdated'
      SiteDeclaredCapacityRecorded:
        $ref: '#/components/messages/SiteDeclaredCapacityRecorded'

  # Operación de espacios: estados, bloqueos y limpieza (F2)
  practiceOperationEvents:
    address: practice.operation
    description: >
      Hechos de la operación de espacios. El envelope real es `messaging.domain_events`
      (eventType, aggregateType, aggregateId, payloadJson); aquí se describe el
      `payloadJson` de cada `eventType` dot.case.
    messages:
      CareSpaceStatusChanged:
        $ref: '#/components/messages/CareSpaceStatusChanged'
      CareSpaceBlockStarted:
        $ref: '#/components/messages/CareSpaceBlockStarted'
      CareSpaceBlockEnded:
        $ref: '#/components/messages/CareSpaceBlockEnded'
      CareSpaceBlockCancelled:
        $ref: '#/components/messages/CareSpaceBlockCancelled'
      CareSpaceBlockOverdue:
        $ref: '#/components/messages/CareSpaceBlockOverdue'
      CleaningOrderCreated:
        $ref: '#/components/messages/CleaningOrderCreated'
      CleaningOrderAssigned:
        $ref: '#/components/messages/CleaningOrderAssigned'
      CleaningOrderStarted:
        $ref: '#/components/messages/CleaningOrderStarted'
      CleaningOrderFinished:
        $ref: '#/components/messages/CleaningOrderFinished'
      CleaningOrderInspected:
        $ref: '#/components/messages/CleaningOrderInspected'
      CleaningOrderRejected:
        $ref: '#/components/messages/CleaningOrderRejected'
      CleaningOrderCancelled:
        $ref: '#/components/messages/CleaningOrderCancelled'

  # Internación y ADT (F3)
  clinicalAdtEvents:
    address: clinical.adt
    description: >
      Movimientos de internación. El envelope real es `messaging.domain_events` (eventType,
      aggregateType, aggregateId, payloadJson); aquí se describe el `payloadJson` de cada `eventType`
      dot.case.
    messages:
      AdtAdmitted:
        $ref: '#/components/messages/AdtAdmitted'
      AdtBedAssigned:
        $ref: '#/components/messages/AdtBedAssigned'
      AdtReservationCreated:
        $ref: '#/components/messages/AdtReservationCreated'
      AdtReservationCancelled:
        $ref: '#/components/messages/AdtReservationCancelled'
      AdtPlacementOverride:
        $ref: '#/components/messages/AdtPlacementOverride'
      AdtTransferred:
        $ref: '#/components/messages/AdtTransferred'
      AdtTransferCancelled:
        $ref: '#/components/messages/AdtTransferCancelled'
      AdtSwapped:
        $ref: '#/components/messages/AdtSwapped'
      AdtDischarged:
        $ref: '#/components/messages/AdtDischarged'
      AdtPlacementIncidentReviewed:
        $ref: '#/components/messages/AdtPlacementIncidentReviewed'
  clinicalCensusEvents:
    address: clinical.census
    description: >
      Censo diario de internación. Alimenta los indicadores de cama (`procesos/12`) y el día-cama de
      facturación (F5e).
    messages:
      CensusDayClosed:
        $ref: '#/components/messages/CensusDayClosed'
      CensusDayAdjusted:
        $ref: '#/components/messages/CensusDayAdjusted'

  # Quirófanos y perioperatorio (F4)
  schedulingResourceEvents:
    address: scheduling.resource
    description: >
      Hechos del catálogo de recursos agendables. El envelope real es
      `messaging.domain_events`; aquí se describe el `payloadJson` de cada `eventType`.
    messages:
      ResourceLinkedToSpace:
        $ref: '#/components/messages/ResourceLinkedToSpace'
  periopOperatingRoomEvents:
    address: periop.operating_room
    description: >
      Bloques de quirófano, check-list OMS y hechos de sala de un caso.
    messages:
      OrBlockCreated:
        $ref: '#/components/messages/OrBlockCreated'
      OrBlockReleased:
        $ref: '#/components/messages/OrBlockReleased'
      OrBlockCancelled:
        $ref: '#/components/messages/OrBlockCancelled'
      ChecklistCreated:
        $ref: '#/components/messages/ChecklistCreated'
      ChecklistPhaseCompleted:
        $ref: '#/components/messages/ChecklistPhaseCompleted'
      CaseRoomEventRecorded:
        $ref: '#/components/messages/CaseRoomEventRecorded'

  # Plano de planta (F1c)
  practiceFloorPlanEvents:
    address: practice.floor_plan
    description: >
      Hechos del plano de planta. El envelope real es `messaging.domain_events`
      (eventType, aggregateType, aggregateId = id del lienzo, payloadJson); aquí se
      describe el `payloadJson` de cada `eventType` dot.case.
    messages:
      FloorPlanCreated:
        $ref: '#/components/messages/FloorPlanCreated'
      FloorPlanUpdated:
        $ref: '#/components/messages/FloorPlanUpdated'
      FloorPlanLifecycleChanged:
        $ref: '#/components/messages/FloorPlanLifecycleChanged'
      FloorPlanBackgroundChanged:
        $ref: '#/components/messages/FloorPlanBackgroundChanged'
      FloorPlanLayoutChanged:
        $ref: '#/components/messages/FloorPlanLayoutChanged'

operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    summary: >
      Un módulo de negocio publica un evento de dominio dentro de su propia
      transacción (OutboxService.publishDomainEvent — sin endpoint HTTP propio,
      UC-35-01 es interno).

  dispatchEvent:
    action: receive
    channel:
      $ref: '#/channels/domainEvents'
    summary: worker-messaging despacha el evento a cada suscripción que coincide con el filtro.

  relayOutbox:
    action: send
    channel:
      $ref: '#/channels/outboxRelay'
    summary: worker-messaging reclama y publica mensajes pendientes del outbox.

  claimQueueJob:
    action: receive
    channel:
      $ref: '#/channels/queueJobs'
    summary: Cualquiera de los 17 workers reclama trabajo pendiente de su cola.

  ackDelivery:
    action: send
    channel:
      $ref: '#/channels/eventDeliveryAck'
    summary: Un consumidor confirma que procesó una entrega.

  receiveProviderReceipt:
    action: receive
    channel:
      $ref: '#/channels/providerWebhookReceipt'
    summary: Un proveedor externo confirma el estado final de una notificación enviada.

  # Estructura de infraestructura (F1)
  publishPracticeStructureEvent:
    action: send
    channel:
      $ref: '#/channels/practiceStructureEvents'
    summary: >
      Los servicios de estructura de `practice` publican cada hecho con
      `StructureEventsService` (OutboxService.publishDomainEvent) en la transacción de la mutación.

  # Operación de espacios: estados, bloqueos y limpieza (F2)
  publishPracticeOperationEvent:
    action: send
    channel:
      $ref: '#/channels/practiceOperationEvents'
    summary: >
      Los servicios de operación de `practice` publican cada hecho con `OpsEventsService`
      (OutboxService.publishDomainEvent) en la transacción de la mutación. La clave de
      idempotencia es `eventType:aggregateId:uniqueRef` (la fila A20, la versión de la
      orden o la fecha estimada del bloqueo), así que reintentar no duplica.

  # Internación y ADT (F3)
  publishClinicalAdtEvent:
    action: send
    channel:
      $ref: '#/channels/clinicalAdtEvents'
    summary: >
      `InpatientAdtService` publica cada movimiento con `AdtEventsService`
      (OutboxService.publishDomainEvent) en la transacción de la mutación.
  publishClinicalCensusEvent:
    action: send
    channel:
      $ref: '#/channels/clinicalCensusEvents'
    summary: >
      `InpatientCensusService` publica el cierre y cada ajuste del censo en la transacción que los
      escribe; el cierre programado lo dispara el worker `clinical` (`actorUserId` nulo).

  # Quirófanos y perioperatorio (F4)
  publishSchedulingResourceEvent:
    action: send
    channel:
      $ref: '#/channels/schedulingResourceEvents'
    summary: >
      `SpaceResourceLinker` publica el alta de un recurso ligado a un espacio con
      OutboxService.publishDomainEvent, en la transacción del alta.
  publishPeriopOperatingRoomEvent:
    action: send
    channel:
      $ref: '#/channels/periopOperatingRoomEvents'
    summary: >
      Los servicios de bloques, check-list y hechos de sala publican cada hecho con
      OutboxService.publishDomainEvent en la transacción de la mutación (los tick de
      liberación automática los publican con `automatic: true` y sin actor).

  # Plano de planta (F1c)
  publishPracticeFloorPlanEvent:
    action: send
    channel:
      $ref: '#/channels/practiceFloorPlanEvents'
    summary: >
      Los servicios del plano publican cada hecho con `PlanEventsService`
      (OutboxService.publishDomainEvent) en la transacción de la mutación.

components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: Evento de dominio
      summary: >
        Envelope real de messaging.domain_events. Ver docs/events/event-catalog.md
        para los 79 valores reales de eventType observados en código (79 sitios de
        publishDomainEvent en 10 módulos productores).
      payload:
        $ref: '#/components/schemas/DomainEventPayload'

    OutboxMessage:
      name: OutboxMessage
      title: Mensaje de outbox
      summary: Estado de publicación de un domain event (pending → published | failed).
      payload:
        type: object
        properties:
          outboxMessageId:
            type: string
            format: uuid
          domainEventId:
            type: string
            format: uuid
          status:
            type: string
            enum: [pending, published, failed]
          attempts:
            type: integer

    QueuedJob:
      name: QueuedJob
      title: Job de cola
      summary: Job genérico reclamado con SKIP LOCKED + visibility timeout.
      payload:
        type: object
        properties:
          jobId:
            type: string
            format: uuid
          queueCode:
            type: string
          status:
            type: string
            enum: [ready, running, succeeded, dead_letter]
          attempts:
            type: integer
          payload:
            type: object
            description: >
              Sin JSON Schema fijo — cada cola define su propia forma de payload
              (ver docs/events/event-catalog.md §"Esquema de payload — no tipado por evento").

    DeliveryAck:
      name: DeliveryAck
      title: Acuse de entrega
      payload:
        type: object
        properties:
          eventDeliveryId:
            type: string
            format: uuid
          acknowledgedAt:
            type: string
            format: date-time

    ProviderReceipt:
      name: ProviderReceipt
      title: Acuse de proveedor externo
      summary: Autenticado por firma (verifySignature), fail-closed ante firma inválida.
      payload:
        type: object
        properties:
          signature:
            type: string
          status:
            type: string
            enum: [delivered, bounced]

    # Estructura de infraestructura (F1)
    CareSpaceCreated:
      name: CareSpaceCreated
      title: practice.care_space.created
      summary: 'Un espacio físico se creó (alta individual, masiva o importación).'
      payload:
        type: object
        required:
          [careSpaceId, practiceSiteId, code, formCode, status, rowVersion]
        properties:
          careSpaceId:
            type: string
            format: uuid
          practiceSiteId:
            type: string
            format: uuid
          parentSpaceId:
            type: [string, 'null']
            format: uuid
          code:
            type: string
          formCode:
            type: string
          status:
            type: string
            enum: [SPACE_ACTIVE, SPACE_PLANNED]
          rowVersion:
            type: integer
      x-event-type: practice.care_space.created
      x-aggregate-type: care_space
    CareSpaceUpdated:
      name: CareSpaceUpdated
      title: practice.care_space.updated
      summary: 'Cambiaron atributos de un espacio (PATCH).'
      payload:
        type: object
        required: [careSpaceId, changedFields, rowVersion]
        properties:
          careSpaceId:
            type: string
            format: uuid
          changedFields:
            type: array
            items:
              type: string
          rowVersion:
            type: integer
      x-event-type: practice.care_space.updated
      x-aggregate-type: care_space
    CareSpaceMoved:
      name: CareSpaceMoved
      title: practice.care_space.moved
      summary: 'Un espacio (con su subárbol) cambió de padre.'
      payload:
        type: object
        required: [careSpaceId, rowVersion]
        properties:
          careSpaceId:
            type: string
            format: uuid
          fromParentSpaceId:
            type: [string, 'null']
            format: uuid
          toParentSpaceId:
            type: [string, 'null']
            format: uuid
          rowVersion:
            type: integer
      x-event-type: practice.care_space.moved
      x-aggregate-type: care_space
    CareSpaceLifecycleChanged:
      name: CareSpaceLifecycleChanged
      title: practice.care_space.lifecycle_changed
      summary: 'Transición de ciclo de vida de un espacio (abrir, cerrar, clausurar…).'
      payload:
        type: object
        required: [careSpaceId, action, from, to, rowVersion]
        properties:
          careSpaceId:
            type: string
            format: uuid
          action:
            type: string
          from:
            type: string
          to:
            type: string
          reason:
            type: [string, 'null']
          rowVersion:
            type: integer
      x-event-type: practice.care_space.lifecycle_changed
      x-aggregate-type: care_space
    ClinicalUnitCreated:
      name: ClinicalUnitCreated
      title: practice.clinical_unit.created
      summary: 'Se creó una unidad clínica.'
      payload:
        type: object
        required: [clinicalUnitId, practiceSiteId, code, rowVersion]
        properties:
          clinicalUnitId:
            type: string
            format: uuid
          practiceSiteId:
            type: string
            format: uuid
          parentUnitId:
            type: [string, 'null']
            format: uuid
          code:
            type: string
          rowVersion:
            type: integer
      x-event-type: practice.clinical_unit.created
      x-aggregate-type: clinical_unit
    ClinicalUnitUpdated:
      name: ClinicalUnitUpdated
      title: practice.clinical_unit.updated
      summary: 'Cambiaron atributos de una unidad clínica.'
      payload:
        type: object
        required: [clinicalUnitId, changedFields, rowVersion]
        properties:
          clinicalUnitId:
            type: string
            format: uuid
          changedFields:
            type: array
            items:
              type: string
          rowVersion:
            type: integer
      x-event-type: practice.clinical_unit.updated
      x-aggregate-type: clinical_unit
    ClinicalUnitLifecycleChanged:
      name: ClinicalUnitLifecycleChanged
      title: practice.clinical_unit.lifecycle_changed
      summary: 'Transición de ciclo de vida de una unidad clínica.'
      payload:
        type: object
        required: [clinicalUnitId, action, from, to, rowVersion]
        properties:
          clinicalUnitId:
            type: string
            format: uuid
          action:
            type: string
          from:
            type: string
          to:
            type: string
          reason:
            type: [string, 'null']
          rowVersion:
            type: integer
      x-event-type: practice.clinical_unit.lifecycle_changed
      x-aggregate-type: clinical_unit
    SpaceUnitAssignmentCreated:
      name: SpaceUnitAssignmentCreated
      title: practice.space_unit_assignment.created
      summary: 'Se vinculó un espacio con una unidad clínica.'
      payload:
        type: object
        required: [assignmentId, careSpaceId, clinicalUnitId, role]
        properties:
          assignmentId:
            type: string
            format: uuid
          careSpaceId:
            type: string
            format: uuid
          clinicalUnitId:
            type: string
            format: uuid
          role:
            type: string
      x-event-type: practice.space_unit_assignment.created
      x-aggregate-type: care_space
    SpaceUnitAssignmentClosed:
      name: SpaceUnitAssignmentClosed
      title: practice.space_unit_assignment.closed
      summary: 'Se cerró la vigencia de un vínculo espacio-unidad.'
      payload:
        type: object
        required: [assignmentId, careSpaceId, clinicalUnitId]
        properties:
          assignmentId:
            type: string
            format: uuid
          careSpaceId:
            type: string
            format: uuid
          clinicalUnitId:
            type: string
            format: uuid
      x-event-type: practice.space_unit_assignment.closed
      x-aggregate-type: care_space
    SiteRegulatoryUpdated:
      name: SiteRegulatoryUpdated
      title: practice.site.regulatory_updated
      summary: 'Cambiaron los datos regulatorios de un establecimiento.'
      payload:
        type: object
        required: [practiceSiteId, changedFields, rowVersion]
        properties:
          practiceSiteId:
            type: string
            format: uuid
          changedFields:
            type: array
            items:
              type: string
          rowVersion:
            type: integer
      x-event-type: practice.site.regulatory_updated
      x-aggregate-type: practice_site
    SiteSnisVerified:
      name: SiteSnisVerified
      title: practice.site.snis_verified
      summary: 'La plataforma verificó el código SNIS de un establecimiento. Sólo la plataforma emite este hecho.'
      payload:
        type: object
        required: [practiceSiteId, snisCode]
        properties:
          practiceSiteId:
            type: string
            format: uuid
          snisCode:
            type: string
      x-event-type: practice.site.snis_verified
      x-aggregate-type: practice_site
    SiteLicenseCreated:
      name: SiteLicenseCreated
      title: practice.site_license.created
      summary: 'Se registró una habilitación sobre organization_extensions.facility_licenses.'
      payload:
        type: object
        required: [licenseId, practiceSiteId, rowVersion]
        properties:
          licenseId:
            type: string
            format: uuid
          practiceSiteId:
            type: string
            format: uuid
          rowVersion:
            type: integer
      x-event-type: practice.site_license.created
      x-aggregate-type: facility_license
    SiteLicenseUpdated:
      name: SiteLicenseUpdated
      title: practice.site_license.updated
      summary: 'Cambió una habilitación del establecimiento.'
      payload:
        type: object
        required: [licenseId, practiceSiteId, changedFields, rowVersion]
        properties:
          licenseId:
            type: string
            format: uuid
          practiceSiteId:
            type: string
            format: uuid
          changedFields:
            type: array
            items:
              type: string
          rowVersion:
            type: integer
      x-event-type: practice.site_license.updated
      x-aggregate-type: facility_license
    SiteDeclaredCapacityRecorded:
      name: SiteDeclaredCapacityRecorded
      title: practice.site.declared_capacity_recorded
      summary: 'Se agregó una capacidad declarada (no sobrescribe: la capacidad derivada se calcula, nunca se escribe).'
      payload:
        type: object
        required: [practiceSiteId, declarationId, kindCode, quantity, asOf]
        properties:
          practiceSiteId:
            type: string
            format: uuid
          declarationId:
            type: string
            format: uuid
          kindCode:
            type: string
          quantity:
            type: integer
          asOf:
            type: string
            format: date
      x-event-type: practice.site.declared_capacity_recorded
      x-aggregate-type: practice_site

    # Operación de espacios: estados, bloqueos y limpieza (F2)
    CareSpaceStatusChanged:
      name: CareSpaceStatusChanged
      title: practice.care_space.status_changed
      summary: 'Un eje de estado de un espacio cambió de valor (equivalente a ADT^A20 / NPU-1, NPU-2). Se publica uno por eje afectado, con el mismo `eventId` que la fila append-only.'
      payload:
        type: object
        required: [careSpaceId, siteId, axis, to, v2Code, source, occurredAt, eventId]
        properties:
          careSpaceId:
            type: string
            format: uuid
          siteId:
            type: string
            format: uuid
          eventId:
            type: string
            format: uuid
            description: Id de la fila append-only de `care_space_status_events`.
          axis:
            type: string
            description: Eje que cambió.
            enum: [AXIS_AVAILABILITY, AXIS_HYGIENE, AXIS_ISOLATION, AXIS_OCCUPANCY]
          from:
            type: [string, 'null']
          to:
            type: string
          v2Code:
            type: string
            description: Resumen HL7 v2-0116 resultante (C, H, I, K, O, U; R es extensión local `urn:mantra:bed-status`).
            enum: [C, H, I, K, O, U, R]
          reasonCode:
            type: [string, 'null']
          reasonText:
            type: [string, 'null']
          expectedUntil:
            type: [string, 'null']
            format: date-time
          source:
            type: string
            description: Origen del cambio.
            enum: [SRC_MANUAL, SRC_ADT, SRC_CLEANING, SRC_BLOCK, SRC_ROOM_EVENT, SRC_SYSTEM]
          sourceRefId:
            type: [string, 'null']
            format: uuid
          occurredAt:
            type: string
            format: date-time
          opsVersion:
            type: integer
          actingRoles:
            type: array
            items:
              type: string
            description: Roles con los que actuó quien hizo el cambio.
          tenantId:
            type: string
            format: uuid
          actorUserId:
            type: [string, 'null']
            format: uuid
            description: Nulo cuando lo origina el sistema (worker, ADT automático).
          requestId:
            type: [string, 'null']
            description: Id de correlación de la petición HTTP que originó el cambio.
