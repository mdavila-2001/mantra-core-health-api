asyncapi: 3.1.0
info:
  title: ALOVIDA Health API — Eventos de la agenda por espacio y del equipo de imagen (F5a, F5d)
  version: '0.1.0'
  description: >
    Fragmento de eventos de dominio de las franjas F5a (equipo de diagnóstico ubicado en una sala y su
    estado operativo) y F5d (horario de una agenda atado a un consultorio, excepciones de
    disponibilidad con origen y recurso agendable del equipo). Se publican al outbox transaccional
    (`messaging.domain_events`) DENTRO de la transacción de la mutación (INV-43): el cambio y su evento
    se confirman juntos o ninguno. La clave de idempotencia del outbox se deriva del contenido, por eso
    los eventos que pueden repetirse con los mismos datos llevan `occurredAt`. Este archivo es un
    fragmento: el integrador lo fusiona en `asyncapi/asyncapi.yaml`; esta rama no edita ese archivo.
    Los payloads llevan ids, códigos y marcas de tiempo; nunca nombres de personas ni datos clínicos.
  license:
    name: UNLICENSED

defaultContentType: application/json

channels:
  schedulingTemplateCareSpace:
    address: scheduling.template
    description: >
      El horario de una agenda se ató a un consultorio o sala, cambió de espacio o se soltó. El envelope
      real es `messaging.domain_events` (eventType, aggregateType, aggregateId, payloadJson).
    messages:
      TemplateCareSpaceSet:
        $ref: '#/components/messages/TemplateCareSpaceSet'
  schedulingAvailabilityException:
    address: scheduling.availability_exception
    description: >
      Excepciones de disponibilidad de un recurso: las manuales y las derivadas de otra fuente (un
      bloqueo del espacio de F2 o el estado del equipo), que son de solo lectura para la interfaz.
    messages:
      AvailabilityExceptionCreated:
        $ref: '#/components/messages/AvailabilityExceptionCreated'
      AvailabilityExceptionEnded:
        $ref: '#/components/messages/AvailabilityExceptionEnded'
  schedulingResourceEquipment:
    address: scheduling.resource
    description: Un recurso agendable se ligó a un equipo de diagnóstico.
    messages:
      ResourceLinkedToEquipment:
        $ref: '#/components/messages/ResourceLinkedToEquipment'
  diagnosticUnitsEquipment:
    address: diagnostic_units.equipment
    description: El equipo de diagnóstico se ubicó en una sala o cambió su estado operativo.
    messages:
      EquipmentLocated:
        $ref: '#/components/messages/EquipmentLocated'
      EquipmentStatusChanged:
        $ref: '#/components/messages/EquipmentStatusChanged'

operations:
  publishTemplateCareSpaceSet:
    action: send
    channel:
      $ref: '#/channels/schedulingTemplateCareSpace'
    summary: >
      `CreateTemplateUseCase` y `UpdateTemplateUseCase` publican el espacio del horario (atado, cambiado
      o soltado) en la transacción que escribe la plantilla.
  publishAvailabilityException:
    action: send
    channel:
      $ref: '#/channels/schedulingAvailabilityException'
    summary: >
      `CreateExceptionUseCase` publica `created` (origen MANUAL); `CareSpaceSlotSync` publica `created` y
      `ended` (origen CARE_SPACE_BLOCK o EQUIPMENT_STATUS) en la transacción del bloqueo del espacio o del
      cambio de estado del equipo, junto con el cierre o la reapertura de los cupos.
  publishResourceLinkedToEquipment:
    action: send
    channel:
      $ref: '#/channels/schedulingResourceEquipment'
    summary: '`EquipmentResourceLinker` publica el alta del recurso `EQUIPMENT` atado a la sala del equipo.'
  publishEquipmentEvent:
    action: send
    channel:
      $ref: '#/channels/diagnosticUnitsEquipment'
    summary: >
      `DiagnosticEquipmentService.updateEquipment` publica `located` cuando cambia la sala y
      `status_changed` cuando cambia el estado, en la transacción que los escribe y que mueve los pasos de
      imagen y las citas del equipo.

components:
  messages:
    TemplateCareSpaceSet:
      name: TemplateCareSpaceSet
      title: scheduling.template.care_space_set
      summary: 'El horario de una agenda quedó atado a un consultorio, cambió de consultorio o se soltó.'
      payload:
        type: object
        required: [templateId, resourceId, careSpaceId, previousCareSpaceId, tenantId, occurredAt]
        properties:
          templateId: { type: string, format: uuid }
          resourceId: { type: string, format: uuid }
          careSpaceId: { type: [string, 'null'], format: uuid, description: 'Espacio que queda; null si se soltó.' }
          previousCareSpaceId: { type: [string, 'null'], format: uuid }
          siteId: { type: [string, 'null'], format: uuid, description: 'Sede del espacio nuevo; null si se soltó o no cambió de espacio.' }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: string, format: uuid }
          occurredAt: { type: string, format: date-time }
    AvailabilityExceptionCreated:
      name: AvailabilityExceptionCreated
      title: scheduling.availability_exception.created
      summary: 'Se creó una excepción de disponibilidad en un recurso; trae su origen.'
      payload:
        type: object
        required: [exceptionId, resourceId, sourceKind, startAt, endAt, isAvailable, tenantId]
        properties:
          exceptionId: { type: string, format: uuid }
          resourceId: { type: string, format: uuid }
          sourceKind:
            type: string
            enum: [MANUAL, CARE_SPACE_BLOCK, EQUIPMENT_STATUS]
            description: 'MANUAL: la creó una persona. Las otras dos las deriva la API y son de solo lectura.'
          sourceRefId: { type: [string, 'null'], format: uuid, description: 'Bloqueo del espacio o equipo que originó la excepción.' }
          startAt: { type: string, format: date-time }
          endAt: { type: string, format: date-time }
          isAvailable: { type: boolean }
          blockedSlots: { type: integer, description: 'Cupos cerrados o bloqueados por la excepción.' }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
    AvailabilityExceptionEnded:
      name: AvailabilityExceptionEnded
      title: scheduling.availability_exception.ended
      summary: 'La fuente de una excepción derivada volvió (se desbloqueó el espacio o el equipo volvió a servicio).'
      payload:
        type: object
        required: [exceptionId, resourceId, sourceKind, removed, tenantId]
        properties:
          exceptionId: { type: string, format: uuid }
          resourceId: { type: string, format: uuid }
          sourceKind: { type: string, enum: [CARE_SPACE_BLOCK, EQUIPMENT_STATUS] }
          sourceRefId: { type: [string, 'null'], format: uuid }
          endedAt: { type: [string, 'null'], format: date-time }
          removed: { type: boolean, description: 'true si la excepción se quitó (no había empezado); false si se acortó.' }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
    ResourceLinkedToEquipment:
      name: ResourceLinkedToEquipment
      title: scheduling.resource.linked_to_equipment
      summary: 'Se creó el recurso agendable de un equipo, atado a su sala.'
      payload:
        type: object
        required: [resourceId, equipmentId, tenantId]
        properties:
          resourceId: { type: string, format: uuid }
          equipmentId: { type: string, format: uuid }
          careSpaceId: { type: [string, 'null'], format: uuid }
          siteId: { type: [string, 'null'], format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: string, format: uuid }
    EquipmentLocated:
      name: EquipmentLocated
      title: diagnostic_units.equipment.located
      summary: 'El equipo se ubicó en una sala, cambió de sala o se desubicó; sus pasos y citas futuras la siguieron.'
      payload:
        type: object
        required: [equipmentId, careSpaceId, previousCareSpaceId, tenantId, occurredAt]
        properties:
          equipmentId: { type: string, format: uuid }
          siteId: { type: string, format: uuid }
          careSpaceId: { type: [string, 'null'], format: uuid }
          previousCareSpaceId: { type: [string, 'null'], format: uuid }
          aeTitle: { type: [string, 'null'], description: 'Scheduled Station AE Title (0040,0001).' }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: string, format: uuid }
          occurredAt: { type: string, format: date-time }
    EquipmentStatusChanged:
      name: EquipmentStatusChanged
      title: diagnostic_units.equipment.status_changed
      summary: 'Cambió el estado operativo del equipo; fuera de servicio cierra los cupos de su recurso.'
      payload:
        type: object
        required: [equipmentId, from, to, outOfService, tenantId, occurredAt]
        properties:
          equipmentId: { type: string, format: uuid }
          siteId: { type: string, format: uuid }
          careSpaceId: { type: [string, 'null'], format: uuid }
          from: { type: string, format: uuid, description: 'Concepto del estado anterior.' }
          to: { type: string, format: uuid, description: 'Concepto del estado nuevo (operativo, mantenimiento o fuera de servicio).' }
          outOfService: { type: boolean }
          futureCommitments: { type: integer, description: 'Reservas futuras reconocidas al sacarlo de servicio.' }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: string, format: uuid }
          occurredAt: { type: string, format: date-time }
