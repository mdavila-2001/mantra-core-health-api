asyncapi: 3.1.0
info:
  title: ALOVIDA Health API — Eventos de operación de espacios (F2)
  version: '0.1.0'
  description: >
    Fragmento de eventos de dominio de la operación de camas y salas (practice: estados
    por ejes, bloqueos y mantenimiento, órdenes de limpieza, aislamiento). Se publican al
    outbox transaccional (`messaging.domain_events`) DENTRO de la transacción de la
    mutación (INV-43): el cambio, su evento A20 append-only y el outbox se confirman
    juntos o ninguno. Este archivo es un fragmento: el integrador lo fusiona en
    `asyncapi/asyncapi.yaml`; esta rama no edita ese archivo. Los payloads nunca llevan
    datos clínicos ni del paciente, sólo ids, versiones y códigos.
  license:
    name: UNLICENSED

defaultContentType: application/json

channels:
  practiceOperationEvents:
    address: practice.operation
    description: >
      Hechos de la operación de espacios. El envelope real es `messaging.domain_events`
      (eventType, aggregateType, aggregateId, payloadJson); aquí se describe el
      `payloadJson` de cada `eventType` dot.case.
    messages:
      CareSpaceStatusChanged:
        $ref: '#/components/messages/CareSpaceStatusChanged'
      CareSpaceBlockStarted:
        $ref: '#/components/messages/CareSpaceBlockStarted'
      CareSpaceBlockEnded:
        $ref: '#/components/messages/CareSpaceBlockEnded'
      CareSpaceBlockCancelled:
        $ref: '#/components/messages/CareSpaceBlockCancelled'
      CareSpaceBlockOverdue:
        $ref: '#/components/messages/CareSpaceBlockOverdue'
      CleaningOrderCreated:
        $ref: '#/components/messages/CleaningOrderCreated'
      CleaningOrderAssigned:
        $ref: '#/components/messages/CleaningOrderAssigned'
      CleaningOrderStarted:
        $ref: '#/components/messages/CleaningOrderStarted'
      CleaningOrderFinished:
        $ref: '#/components/messages/CleaningOrderFinished'
      CleaningOrderInspected:
        $ref: '#/components/messages/CleaningOrderInspected'
      CleaningOrderRejected:
        $ref: '#/components/messages/CleaningOrderRejected'
      CleaningOrderCancelled:
        $ref: '#/components/messages/CleaningOrderCancelled'

operations:
  publishPracticeOperationEvent:
    action: send
    channel:
      $ref: '#/channels/practiceOperationEvents'
    summary: >
      Los servicios de operación de `practice` publican cada hecho con `OpsEventsService`
      (OutboxService.publishDomainEvent) en la transacción de la mutación. La clave de
      idempotencia es `eventType:aggregateId:uniqueRef` (la fila A20, la versión de la
      orden o la fecha estimada del bloqueo), así que reintentar no duplica.

components:
  messages:
    CareSpaceStatusChanged:
      name: CareSpaceStatusChanged
      title: practice.care_space.status_changed
      summary: 'Un eje de estado de un espacio cambió de valor (equivalente a ADT^A20 / NPU-1, NPU-2). Se publica uno por eje afectado, con el mismo `eventId` que la fila append-only.'
      payload:
        type: object
        required: [careSpaceId, siteId, axis, to, v2Code, source, occurredAt, eventId]
        properties:
          careSpaceId:
            type: string
            format: uuid
          siteId:
            type: string
            format: uuid
          eventId:
            type: string
            format: uuid
            description: Id de la fila append-only de `care_space_status_events`.
          axis:
            type: string
            description: Eje que cambió.
            enum: [AXIS_AVAILABILITY, AXIS_HYGIENE, AXIS_ISOLATION, AXIS_OCCUPANCY]
          from:
            type: [string, 'null']
          to:
            type: string
          v2Code:
            type: string
            description: Resumen HL7 v2-0116 resultante (C, H, I, K, O, U; R es extensión local `urn:mantra:bed-status`).
            enum: [C, H, I, K, O, U, R]
          reasonCode:
            type: [string, 'null']
          reasonText:
            type: [string, 'null']
          expectedUntil:
            type: [string, 'null']
            format: date-time
          source:
            type: string
            description: Origen del cambio.
            enum: [SRC_MANUAL, SRC_ADT, SRC_CLEANING, SRC_BLOCK, SRC_ROOM_EVENT, SRC_SYSTEM]
          sourceRefId:
            type: [string, 'null']
            format: uuid
          occurredAt:
            type: string
            format: date-time
          opsVersion:
            type: integer
          actingRoles:
            type: array
            items:
              type: string
            description: Roles con los que actuó quien hizo el cambio.
          tenantId:
            type: string
            format: uuid
          actorUserId:
            type: [string, 'null']
            format: uuid
            description: Nulo cuando lo origina el sistema (worker, ADT automático).
          requestId:
            type: [string, 'null']
            description: Id de correlación de la petición HTTP que originó el cambio.
      x-event-type: practice.care_space.status_changed
      x-aggregate-type: care_space
