asyncapi: 3.1.0
info:
  title: ALOVIDA Health API — Facturación de espacios y contabilidad (F5e / F5f)
  version: '0.1.0'
  description: >
    Fragmento de eventos de dominio de las tarifas de espacio, los cargos devengados (día-cama por la
    regla de medianoche y uso de quirófano por tiempo) y la ubicación contable de activos y centros de
    costo. Se publican al outbox transaccional (`messaging.domain_events`) DENTRO de la transacción de
    la mutación: el cambio y su evento se confirman juntos o ninguno. Este archivo es un fragmento: el
    integrador lo fusiona en `asyncapi/asyncapi.yaml`; esta rama no edita ese archivo. Los devengos
    programados (worker `billing`) publican con `actorUserId` nulo. Los payloads nunca llevan nombres,
    datos clínicos ni el texto libre de un motivo: sólo ids, fechas y códigos.
  license:
    name: UNLICENSED

defaultContentType: application/json

channels:
  billingChargeCaptureEvents:
    address: billing.charge_capture
    description: >
      Cargos devengados antes de facturar. El envelope real es `messaging.domain_events` (eventType,
      aggregateType `charge_capture`, aggregateId, payloadJson).
    messages:
      ChargeCaptureCreated:
        $ref: '#/components/messages/ChargeCaptureCreated'
      ChargeCaptureTariffMissing:
        $ref: '#/components/messages/ChargeCaptureTariffMissing'
      ChargeCaptureVoided:
        $ref: '#/components/messages/ChargeCaptureVoided'
      ChargeCaptureInvoiced:
        $ref: '#/components/messages/ChargeCaptureInvoiced'
  billingSpaceTariffEvents:
    address: billing.space_tariff
    description: Tarifas de espacio versionadas con vigencia (aggregateType `space_tariff`).
    messages:
      SpaceTariffCreated:
        $ref: '#/components/messages/SpaceTariffCreated'
      SpaceTariffClosed:
        $ref: '#/components/messages/SpaceTariffClosed'
  accountingInfrastructureEvents:
    address: accounting.infrastructure
    description: Ubicación de activos en espacios y centro de costo por unidad clínica.
    messages:
      InfrastructureItemLocated:
        $ref: '#/components/messages/InfrastructureItemLocated'
      CostCenterUnitLinked:
        $ref: '#/components/messages/CostCenterUnitLinked'

operations:
  publishBillingChargeCaptureEvent:
    action: send
    channel:
      $ref: '#/channels/billingChargeCaptureEvents'
    summary: >
      `BedDayChargesService` y `OrTimeChargesService` (devengo, actor nulo), `ChargeCapturesService`
      (anulación) e `InvoicesService` (emisión) publican con `ChargeEventsService`
      (OutboxService.publishDomainEvent) en la transacción de la mutación.
  publishBillingSpaceTariffEvent:
    action: send
    channel:
      $ref: '#/channels/billingSpaceTariffEvents'
    summary: '`SpaceTariffsService` publica el alta y el cierre de cada tarifa.'
  publishAccountingInfrastructureEvent:
    action: send
    channel:
      $ref: '#/channels/accountingInfrastructureEvents'
    summary: '`AccountingInfrastructureService` publica la ubicación del activo y el vínculo del centro de costo.'

components:
  messages:
    ChargeCaptureCreated:
      name: ChargeCaptureCreated
      title: billing.charge_capture.created
      summary: >
        Se devengó un cargo `CHG_PENDING`: un día-cama (una medianoche ocupada, o el día mínimo de una
        estancia sin medianoche) o el tiempo de quirófano de un caso completado. Idempotente por
        `BEDDAY:<encuentro>:<fecha>` / `ORTIME:<caso>`: reaplicar el devengo no lo publica de nuevo.
      payload:
        type: object
        required: [chargeCaptureId, encounterId, sourceKind, serviceDate, quantity]
        properties:
          chargeCaptureId: { type: string, format: uuid }
          encounterId: { type: string, format: uuid }
          sourceKind: { type: string, enum: [BED_DAY, OR_TIME] }
          serviceDate: { type: string, format: date }
          careSpaceId: { type: [string, 'null'], format: uuid, description: Cama o quirófano. }
          bedCategoryConceptId: { type: [string, 'null'], format: uuid, description: 'Categoría de la cama en la medianoche (día-cama).' }
          procedureCaseId: { type: [string, 'null'], format: uuid, description: Caso de quirófano (uso por tiempo). }
          minutes: { type: [number, 'null'], description: Minutos de sala (uso por tiempo). }
          timeSource: { type: [string, 'null'], enum: [ROOM_EVENTS, CASE_ACTUALS, null] }
          quantity: { type: string, description: 'Días (1) o unidades de tiempo.' }
          unitPrice: { type: [string, 'null'], description: 'Foto del precio; nulo si no había tarifa vigente.' }
          minimumStay: { type: boolean, description: 'Día mínimo de una estancia sin medianoche.' }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    ChargeCaptureTariffMissing:
      name: ChargeCaptureTariffMissing
      title: billing.charge_capture.tariff_missing
      summary: >
        Alerta de configuración: se devengó un cargo sin tarifa vigente. Queda pendiente sin precio (no se
        inventa uno ni se usa otra tarifa) hasta que Facturación cree la tarifa; el siguiente devengo lo completa.
      payload:
        type: object
        required: [chargeCaptureId, encounterId, serviceDate, tariffKind]
        properties:
          chargeCaptureId: { type: string, format: uuid }
          encounterId: { type: string, format: uuid }
          sourceKind: { type: string, enum: [BED_DAY, OR_TIME] }
          serviceDate: { type: string, format: date }
          careSpaceId: { type: [string, 'null'], format: uuid }
          bedCategoryConceptId: { type: [string, 'null'], format: uuid }
          tariffKind: { type: string, enum: [TARIFF_BED_DAY, TARIFF_OR_TIME] }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    ChargeCaptureVoided:
      name: ChargeCaptureVoided
      title: billing.charge_capture.voided
      summary: >
        Se anuló un cargo, con motivo (que queda en la fila y en la historia, nunca en el evento). Un cargo
        emitido no se edita: se anula. `origin` distingue la anulación de una persona de la corrección
        automática de un cargo pendiente cuya noche la ocupación corregida ya no sustenta.
      payload:
        type: object
        required: [chargeCaptureId, encounterId, serviceDate, previousStatus, origin]
        properties:
          chargeCaptureId: { type: string, format: uuid }
          encounterId: { type: string, format: uuid }
          sourceKind: { type: string, enum: [BED_DAY, OR_TIME] }
          serviceDate: { type: string, format: date }
          previousStatus: { type: string, enum: [PENDING, INVOICED] }
          invoiceLineId: { type: [string, 'null'], format: uuid, description: 'Se conserva: la factura se corrige con nota de crédito.' }
          origin: { type: string, enum: [MANUAL, OCCUPANCY_CORRECTION] }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    ChargeCaptureInvoiced:
      name: ChargeCaptureInvoiced
      title: billing.charge_capture.invoiced
      summary: 'Un cargo entró en una factura (`issue-from-encounter` con `chargeCaptureIds`), en la misma transacción que la factura.'
      payload:
        type: object
        required: [chargeCaptureId, encounterId, serviceDate, invoiceId, invoiceLineId]
        properties:
          chargeCaptureId: { type: string, format: uuid }
          encounterId: { type: string, format: uuid }
          serviceDate: { type: string, format: date }
          invoiceId: { type: string, format: uuid }
          invoiceLineId: { type: string, format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    SpaceTariffCreated:
      name: SpaceTariffCreated
      title: billing.space_tariff.created
      summary: 'Se creó una tarifa de día-cama (por categoría o propia de una sala) o de quirófano por tiempo.'
      payload:
        type: object
        required: [spaceTariffId, practiceId, kind, validFrom]
        properties:
          spaceTariffId: { type: string, format: uuid }
          practiceId: { type: string, format: uuid }
          kind: { type: string, enum: [TARIFF_BED_DAY, TARIFF_OR_TIME] }
          bedCategoryCode: { type: [string, 'null'], example: BED_CAT_ICU }
          careSpaceId: { type: [string, 'null'], format: uuid }
          validFrom: { type: string, format: date }
          validTo: { type: [string, 'null'], format: date }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    SpaceTariffClosed:
      name: SpaceTariffClosed
      title: billing.space_tariff.closed
      summary: 'Se cerró la vigencia de una tarifa (no se edita ni se borra). No altera los cargos ya devengados.'
      payload:
        type: object
        required: [spaceTariffId, practiceId, validTo]
        properties:
          spaceTariffId: { type: string, format: uuid }
          practiceId: { type: string, format: uuid }
          validTo: { type: string, format: date, description: Primer día en que ya no rige. }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    InfrastructureItemLocated:
      name: InfrastructureItemLocated
      title: accounting.infrastructure_item.located
      summary: 'Un activo de infraestructura quedó ubicado en un espacio de su práctica, o desubicado (`careSpaceId` nulo).'
      payload:
        type: object
        required: [infrastructureItemId, practiceId, careSpaceId, previousCareSpaceId]
        properties:
          infrastructureItemId: { type: string, format: uuid }
          practiceId: { type: string, format: uuid }
          careSpaceId: { type: [string, 'null'], format: uuid }
          previousCareSpaceId: { type: [string, 'null'], format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    CostCenterUnitLinked:
      name: CostCenterUnitLinked
      title: accounting.cost_center.unit_linked
      summary: >
        Un centro de costo quedó vinculado a una unidad clínica. A lo sumo un centro de costo activo por
        unidad; los cargos devengados toman el centro de costo de la unidad dueña del espacio.
      payload:
        type: object
        required: [costCenterId, practiceId, clinicalUnitId]
        properties:
          costCenterId: { type: string, format: uuid }
          practiceId: { type: string, format: uuid }
          clinicalUnitId: { type: string, format: uuid }
          previousClinicalUnitId: { type: [string, 'null'], format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
