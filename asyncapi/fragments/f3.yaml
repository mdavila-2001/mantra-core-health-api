asyncapi: 3.1.0
info:
  title: ALOVIDA Health API — Eventos de internación / ADT (F3)
  version: '0.1.0'
  description: >
    Fragmento de eventos de dominio que publica la internación (clinical: ingreso, asignación y
    reserva de cama, traslado, intercambio, egreso, cancelaciones, incidentes de colocación y censo
    diario). Se publican al outbox transaccional (`messaging.domain_events`) DENTRO de la transacción
    de la mutación (INV-43): el cambio y su evento se confirman juntos o ninguno. Este archivo es un
    fragmento: el integrador lo fusiona en `asyncapi/asyncapi.yaml`; esta rama no edita ese archivo.
    El estado de la cama (`practice.care_space.status_changed`, equivalente a ADT^A20) y la creación
    de la orden de limpieza (`practice.cleaning_order.created`) los emite F2 por el puerto
    `CareSpaceOpsPort`, no se repiten acá. Los payloads nunca llevan datos clínicos ni nombres: sólo
    ids, códigos y versiones.
  license:
    name: UNLICENSED

defaultContentType: application/json

channels:
  clinicalAdtEvents:
    address: clinical.adt
    description: >
      Movimientos de internación. El envelope real es `messaging.domain_events` (eventType,
      aggregateType, aggregateId, payloadJson); aquí se describe el `payloadJson` de cada `eventType`
      dot.case.
    messages:
      AdtAdmitted:
        $ref: '#/components/messages/AdtAdmitted'
      AdtBedAssigned:
        $ref: '#/components/messages/AdtBedAssigned'
      AdtReservationCreated:
        $ref: '#/components/messages/AdtReservationCreated'
      AdtReservationCancelled:
        $ref: '#/components/messages/AdtReservationCancelled'
      AdtPlacementOverride:
        $ref: '#/components/messages/AdtPlacementOverride'
      AdtTransferred:
        $ref: '#/components/messages/AdtTransferred'
      AdtTransferCancelled:
        $ref: '#/components/messages/AdtTransferCancelled'
      AdtSwapped:
        $ref: '#/components/messages/AdtSwapped'
      AdtDischarged:
        $ref: '#/components/messages/AdtDischarged'
      AdtPlacementIncidentReviewed:
        $ref: '#/components/messages/AdtPlacementIncidentReviewed'
  clinicalCensusEvents:
    address: clinical.census
    description: >
      Censo diario de internación. Alimenta los indicadores de cama (`procesos/12`) y el día-cama de
      facturación (F5e).
    messages:
      CensusDayClosed:
        $ref: '#/components/messages/CensusDayClosed'
      CensusDayAdjusted:
        $ref: '#/components/messages/CensusDayAdjusted'

operations:
  publishClinicalAdtEvent:
    action: send
    channel:
      $ref: '#/channels/clinicalAdtEvents'
    summary: >
      `InpatientAdtService` publica cada movimiento con `AdtEventsService`
      (OutboxService.publishDomainEvent) en la transacción de la mutación.
  publishClinicalCensusEvent:
    action: send
    channel:
      $ref: '#/channels/clinicalCensusEvents'
    summary: >
      `InpatientCensusService` publica el cierre y cada ajuste del censo en la transacción que los
      escribe; el cierre programado lo dispara el worker `clinical` (`actorUserId` nulo).

components:
  messages:
    AdtAdmitted:
      name: AdtAdmitted
      title: clinical.adt.admitted
      summary: 'Ingreso del paciente (HL7 ADT^A01). Con cama asignada u ocupada en espera de cama.'
      payload:
        type: object
        required: [encounterId, patientProfileId, practiceSiteId, admittedAt]
        properties:
          encounterId: { type: string, format: uuid }
          patientProfileId: { type: string, format: uuid }
          episodeId: { type: [string, 'null'], format: uuid }
          practiceSiteId: { type: string, format: uuid }
          encounterLocationId: { type: [string, 'null'], format: uuid }
          careSpaceId: { type: [string, 'null'], format: uuid }
          bedMode: { type: [string, 'null'], enum: [ASSIGN, RESERVE, null] }
          levelOfCareCode: { type: string, example: LOC_CARE_GENERAL }
          admissionSourceCode: { type: string, example: ADM_SRC_EMERGENCY }
          admittedAt: { type: string, format: date-time }
          incidentId: { type: [string, 'null'], format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtBedAssigned:
      name: AdtBedAssigned
      title: clinical.adt.bed_assigned
      summary: 'Se asignó una cama a un encuentro ya ingresado, o se convirtió su reserva (ADT^A01/A02).'
      payload:
        type: object
        required: [encounterId, encounterLocationId, careSpaceId, mode, occurredAt]
        properties:
          encounterId: { type: string, format: uuid }
          encounterLocationId: { type: string, format: uuid }
          careSpaceId: { type: string, format: uuid }
          mode: { type: string, enum: [ASSIGN] }
          occurredAt: { type: string, format: date-time }
          convertedReservationId: { type: [string, 'null'], format: uuid }
          incidentId: { type: [string, 'null'], format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtReservationCreated:
      name: AdtReservationCreated
      title: clinical.adt.reservation_created
      summary: 'Una cama quedó reservada para un encuentro (ADT^A14/A15).'
      payload:
        type: object
        required: [encounterId, encounterLocationId, careSpaceId, mode, occurredAt]
        properties:
          encounterId: { type: string, format: uuid }
          encounterLocationId: { type: string, format: uuid }
          careSpaceId: { type: string, format: uuid }
          mode: { type: string, enum: [RESERVE] }
          occurredAt: { type: string, format: date-time }
          incidentId: { type: [string, 'null'], format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtReservationCancelled:
      name: AdtReservationCancelled
      title: clinical.adt.reservation_cancelled
      summary: 'Una reserva de cama se canceló (ADT^A11 parcial).'
      payload:
        type: object
        required: [encounterId, encounterLocationId, careSpaceId]
        properties:
          encounterId: { type: string, format: uuid }
          encounterLocationId: { type: string, format: uuid }
          careSpaceId: { type: string, format: uuid }
          reason: { type: string }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtPlacementOverride:
      name: AdtPlacementOverride
      title: clinical.adt.placement_override
      summary: 'Se forzó la compatibilidad de una cama con justificación: se abrió un incidente de colocación.'
      payload:
        type: object
        required: [incidentId, encounterId, careSpaceId, encounterLocationId]
        properties:
          incidentId: { type: string, format: uuid }
          encounterId: { type: string, format: uuid }
          careSpaceId: { type: string, format: uuid }
          encounterLocationId: { type: string, format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtTransferred:
      name: AdtTransferred
      title: clinical.adt.transferred
      summary: 'Traslado entre camas (ADT^A02): PV1-3 la ubicación nueva, PV1-6 la previa. El origen queda sucio con su orden de limpieza.'
      payload:
        type: object
        required:
          [encounterId, fromLocationId, toLocationId, fromCareSpaceId, toCareSpaceId, previousEncounterLocationId, occurredAt, reasonCode, cleaningOrderId]
        properties:
          encounterId: { type: string, format: uuid }
          fromLocationId: { type: string, format: uuid }
          toLocationId: { type: string, format: uuid }
          fromCareSpaceId: { type: string, format: uuid }
          toCareSpaceId: { type: string, format: uuid }
          previousEncounterLocationId: { type: string, format: uuid, description: 'PV1-6.' }
          occurredAt: { type: string, format: date-time }
          reasonCode: { type: string }
          cleaningOrderId: { type: string, format: uuid }
          terminalCleaning: { type: boolean }
          incidentId: { type: [string, 'null'], format: uuid }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtTransferCancelled:
      name: AdtTransferCancelled
      title: clinical.adt.transfer_cancelled
      summary: 'Un traslado se canceló y el paciente volvió a su cama previa (ADT^A12).'
      payload:
        type: object
        required: [encounterId, cancelledLocationId, reopenedLocationId, fromCareSpaceId, toCareSpaceId]
        properties:
          encounterId: { type: string, format: uuid }
          cancelledLocationId: { type: string, format: uuid }
          reopenedLocationId: { type: string, format: uuid }
          fromCareSpaceId: { type: string, format: uuid }
          toCareSpaceId: { type: string, format: uuid }
          reason: { type: string }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtSwapped:
      name: AdtSwapped
      title: clinical.adt.swapped
      summary: 'Dos pacientes intercambiaron de cama en una sola transacción (ADT^A17).'
      payload:
        type: object
        required: [encounterAId, encounterBId, closedLocationIds, openedLocationIds, careSpaceAId, careSpaceBId, occurredAt]
        properties:
          encounterAId: { type: string, format: uuid }
          encounterBId: { type: string, format: uuid }
          closedLocationIds: { type: array, items: { type: string, format: uuid }, minItems: 2, maxItems: 2 }
          openedLocationIds: { type: array, items: { type: string, format: uuid }, minItems: 2, maxItems: 2 }
          careSpaceAId: { type: string, format: uuid, description: 'Cama donde estaba A (ahora B).' }
          careSpaceBId: { type: string, format: uuid, description: 'Cama donde estaba B (ahora A).' }
          occurredAt: { type: string, format: date-time }
          cleaningOrderIds: { type: array, items: { type: string, format: uuid }, description: 'Sólo con infra.swap_requires_cleaning=true.' }
          incidentIds: { type: array, items: { type: string, format: uuid } }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtDischarged:
      name: AdtDischarged
      title: clinical.adt.discharged
      summary: 'Egreso del paciente (ADT^A03). La cama queda sucia con su orden de limpieza (terminal con aislamiento o contaminación).'
      payload:
        type: object
        required: [encounterId, dischargeDispositionCode, occurredAt]
        properties:
          encounterId: { type: string, format: uuid }
          encounterLocationId: { type: [string, 'null'], format: uuid }
          careSpaceId: { type: [string, 'null'], format: uuid }
          dischargeDispositionCode: { type: string, example: DISP_HOME }
          occurredAt: { type: string, format: date-time }
          cleaningOrderId: { type: [string, 'null'], format: uuid }
          episodeClosed: { type: boolean }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    AdtPlacementIncidentReviewed:
      name: AdtPlacementIncidentReviewed
      title: clinical.adt.placement_incident_reviewed
      summary: 'Un incidente de colocación se revisó o se cerró.'
      payload:
        type: object
        required: [incidentId, encounterId, careSpaceId, status]
        properties:
          incidentId: { type: string, format: uuid }
          encounterId: { type: string, format: uuid }
          careSpaceId: { type: string, format: uuid }
          status: { type: string, enum: [REVIEWED, CLOSED] }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    CensusDayClosed:
      name: CensusDayClosed
      title: clinical.census_day.closed
      summary: 'Se cerró (y selló) el censo de una unidad para un día. Inmutable desde este evento.'
      payload:
        type: object
        required: [censusDayId, siteId, unitId, date, cutoffAt, contentHash]
        properties:
          censusDayId: { type: string, format: uuid }
          siteId: { type: string, format: uuid }
          unitId: { type: string, format: uuid }
          date: { type: string, format: date }
          cutoffAt: { type: string, format: date-time }
          contentHash: { type: string, description: 'SHA-256 de los recuentos y las entradas.' }
          closedBySystem: { type: boolean }
          bedsAvailable: { type: integer }
          patientDays: { type: integer }
          admissions: { type: integer }
          discharges: { type: integer }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
    CensusDayAdjusted:
      name: CensusDayAdjusted
      title: clinical.census_day.adjusted
      summary: 'Se ajustó un número de un censo cerrado. El snapshot no cambia; el ajuste es una fila aparte.'
      payload:
        type: object
        required: [censusDayId, adjustmentId, fieldCode, previousValue, newValue]
        properties:
          censusDayId: { type: string, format: uuid }
          adjustmentId: { type: string, format: uuid }
          siteId: { type: string, format: uuid }
          unitId: { type: string, format: uuid }
          date: { type: string, format: date }
          fieldCode:
            type: string
            enum:
              - beds_censable
              - beds_available
              - beds_blocked
              - patients_at_cutoff
              - admissions
              - discharges
              - deaths
              - transfers_in
              - transfers_out
              - same_day_stays
              - patient_days
              - discharge_stay_days
          previousValue: { type: integer }
          newValue: { type: integer }
          tenantId: { type: string, format: uuid }
          actorUserId: { type: [string, 'null'], format: uuid }
          requestId: { type: [string, 'null'] }
