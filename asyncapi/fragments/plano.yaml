asyncapi: 3.1.0
info:
  title: ALOVIDA Health API — Eventos del plano de planta (F1c)
  version: '0.1.0'
  description: >
    Fragmento de eventos de dominio del plano de planta (practice: lienzos, ubicaciones
    de espacios, elementos y fondo). Se publican al outbox transaccional
    (`messaging.domain_events`, aggregateType `floor_plan`) DENTRO de la transacción de la
    mutación: el cambio y su evento se confirman juntos o ninguno. Un guardado de layout
    emite UN solo evento `layout_changed` por lote, no uno por elemento. Los payloads solo
    llevan ids, versiones y conteos: nunca nombres de pacientes, geometría ni datos
    clínicos. Este archivo es un fragmento: el integrador lo fusiona en
    `asyncapi/asyncapi.yaml`; esta rama no edita ese archivo.
  license:
    name: UNLICENSED

defaultContentType: application/json

channels:
  practiceFloorPlanEvents:
    address: practice.floor_plan
    description: >
      Hechos del plano de planta. El envelope real es `messaging.domain_events`
      (eventType, aggregateType, aggregateId = id del lienzo, payloadJson); aquí se
      describe el `payloadJson` de cada `eventType` dot.case.
    messages:
      FloorPlanCreated:
        $ref: '#/components/messages/FloorPlanCreated'
      FloorPlanUpdated:
        $ref: '#/components/messages/FloorPlanUpdated'
      FloorPlanLifecycleChanged:
        $ref: '#/components/messages/FloorPlanLifecycleChanged'
      FloorPlanBackgroundChanged:
        $ref: '#/components/messages/FloorPlanBackgroundChanged'
      FloorPlanLayoutChanged:
        $ref: '#/components/messages/FloorPlanLayoutChanged'

operations:
  publishPracticeFloorPlanEvent:
    action: send
    channel:
      $ref: '#/channels/practiceFloorPlanEvents'
    summary: >
      Los servicios del plano publican cada hecho con `PlanEventsService`
      (OutboxService.publishDomainEvent) en la transacción de la mutación.

components:
  messages:
    FloorPlanCreated:
      name: FloorPlanCreated
      title: practice.floor_plan.created
      summary: 'Se creó un lienzo (piso, planta o campus).'
      payload:
        type: object
        required: [floorPlanId, tenantId, siteId, anchorSpaceId, layoutVersion]
        properties:
          floorPlanId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          siteId:
            type: string
            format: uuid
          actorUserId:
            type: string
            format: uuid
          requestId:
            type: [string, 'null']
          supportReason:
            type: string
            description: Motivo declarado por el soporte de plataforma (solo si actuó soporte).
          anchorSpaceId:
            type: string
            format: uuid
          layoutVersion:
            type: integer
      x-event-type: practice.floor_plan.created
      x-aggregate-type: floor_plan
    FloorPlanUpdated:
      name: FloorPlanUpdated
      title: practice.floor_plan.updated
      summary: 'Cambiaron atributos del lienzo (tamaño, grilla, escala, nombre).'
      payload:
        type: object
        required: [floorPlanId, tenantId, siteId, anchorSpaceId, layoutVersion, rowVersion, changedFields]
        properties:
          floorPlanId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          siteId:
            type: string
            format: uuid
          actorUserId:
            type: string
            format: uuid
          requestId:
            type: [string, 'null']
          supportReason:
            type: string
            description: Motivo declarado por el soporte de plataforma (solo si actuó soporte).
          anchorSpaceId:
            type: string
            format: uuid
          layoutVersion:
            type: integer
          rowVersion:
            type: integer
          changedFields:
            type: array
            items:
              type: string
      x-event-type: practice.floor_plan.updated
      x-aggregate-type: floor_plan
    FloorPlanLifecycleChanged:
      name: FloorPlanLifecycleChanged
      title: practice.floor_plan.lifecycle_changed
      summary: 'Transición de ciclo de vida del lienzo (publicar, archivar, reabrir).'
      payload:
        type: object
        required: [floorPlanId, tenantId, siteId, anchorSpaceId, layoutVersion, action, reason]
        properties:
          floorPlanId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          siteId:
            type: string
            format: uuid
          actorUserId:
            type: string
            format: uuid
          requestId:
            type: [string, 'null']
          supportReason:
            type: string
            description: Motivo declarado por el soporte de plataforma (solo si actuó soporte).
          anchorSpaceId:
            type: string
            format: uuid
          layoutVersion:
            type: integer
          action:
            type: string
          reason:
            type: string
      x-event-type: practice.floor_plan.lifecycle_changed
      x-aggregate-type: floor_plan
    FloorPlanBackgroundChanged:
      name: FloorPlanBackgroundChanged
      title: practice.floor_plan.background_changed
      summary: 'Se fijó o se quitó el fondo calibrado del lienzo.'
      payload:
        type: object
        required: [floorPlanId, tenantId, siteId, anchorSpaceId, layoutVersion, change]
        properties:
          floorPlanId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          siteId:
            type: string
            format: uuid
          actorUserId:
            type: string
            format: uuid
          requestId:
            type: [string, 'null']
          supportReason:
            type: string
            description: Motivo declarado por el soporte de plataforma (solo si actuó soporte).
          anchorSpaceId:
            type: string
            format: uuid
          layoutVersion:
            type: integer
          change:
            type: string
            enum: [SET, CLEARED]
      x-event-type: practice.floor_plan.background_changed
      x-aggregate-type: floor_plan
    FloorPlanLayoutChanged:
      name: FloorPlanLayoutChanged
      title: practice.floor_plan.layout_changed
      summary: 'Un guardado de layout (PATCH/PUT) se confirmó; un evento por lote.'
      payload:
        type: object
        required: [floorPlanId, tenantId, siteId, fromVersion, toVersion, placedSpaceIds, movedSpaceIds, removedSpaceIds, truncated]
        properties:
          floorPlanId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          siteId:
            type: string
            format: uuid
          actorUserId:
            type: string
            format: uuid
          requestId:
            type: [string, 'null']
          supportReason:
            type: string
            description: Motivo declarado por el soporte de plataforma (solo si actuó soporte).
          fromVersion:
            type: integer
          toVersion:
            type: integer
            description: La layoutVersion nueva (+1 por transacción).
          placedSpaceIds:
            type: array
            description: Espacios que se ubicaron por primera vez en el lote.
            maxItems: 200
            items:
              type: string
              format: uuid
          movedSpaceIds:
            type: array
            description: Espacios cuya ubicación cambió.
            maxItems: 200
            items:
              type: string
              format: uuid
          removedSpaceIds:
            type: array
            description: Espacios retirados del plano.
            maxItems: 200
            items:
              type: string
              format: uuid
          elementsAdded:
            type: integer
          elementsChanged:
            type: integer
          elementsRemoved:
            type: integer
          truncated:
            type: boolean
            description: true si alguna lista de ids superó el tope de 200 y se recortó.
      x-event-type: practice.floor_plan.layout_changed
      x-aggregate-type: floor_plan
