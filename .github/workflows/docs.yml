name: CI · API

# Este es el CI de la API, no sólo el de la documentación: compila, verifica
# tipos, lint, auditoría de dependencias, pruebas unitarias e integración,
# contratos y, al final, el portal. Se llamó «Documentación» porque nació en la
# fase 16 del plan de documentación; el nombre viejo escondía que un rojo acá
# es un rojo de la API. El archivo conserva su ruta (`docs.yml`) para no romper
# referencias ni el historial de ejecuciones.
#
# Fase 16 del plan de documentación. Convierte la documentación en parte
# obligatoria del producto: un PR que rompe el contrato OpenAPI/AsyncAPI, deja
# un enlace roto, o hace fallar `mkdocs build --strict`, no puede mergearse.
#
# Incluye build, tipos, lint, auditoría runtime, pruebas y contratos. El lint
# productivo es type-aware; los fixtures de prueba conservan una política
# específica para dobles parciales sin relajar ningún archivo de runtime.

# `dev` va incluida además de `master`: es la rama protegida contra la que
# trabaja todo el equipo y por la que entra cada PR, así que era la que más
# falta hacía verificar. Mientras sólo se disparaba en `master`, un PR a `dev`
# no reportaba ni un solo check —el equipo mergeaba a ciegas— y el trabajo
# llegaba a `master` ya integrado, donde el fallo aparece tarde y mezclado con
# el de otros.
# Desde el 18/08 corre en un runner propio (ver más abajo), que es una máquina
# del equipo y no una flota elástica: el disparo se acota a `pull_request` para
# que el trabajo llegue en el momento en que sirve —antes de mergear— sin
# duplicar cada corrida con el `push` que sigue al merge. `workflow_dispatch`
# queda para lanzar la batería a mano sobre una rama cuando haga falta.
#
# `push` a `dev` vuelve desde el 31/10/2026: el job corre en `ubuntu-latest`
# (ver abajo), así que la duplicación con el PR ya no ocupa la máquina del
# equipo, y `dev` necesita su propia ejecución para saber si lo integrado —un
# merge puede combinar dos PRs verdes que juntos fallan— sigue en verde.
on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [dev]
  workflow_dispatch:

# Mínimo privilegio para el GITHUB_TOKEN (MCH-031). Ningún paso escribe en el
# repositorio: sólo lee el código y, en la ejecución manual, sube un artefacto
# (que no necesita permisos de `contents`).
permissions:
  contents: read

jobs:
  # Frontera de confianza del runner propio (MCH-014). El repositorio es público y
  # `marcelo-wsl-api` es una máquina del equipo con Docker y el stack de desarrollo
  # al lado: el código de un PR que viene de un fork no puede ejecutarse ahí. Estos
  # PRs no se validan en ese runner; el job de abajo falla a propósito —sin hacer
  # checkout ni ejecutar nada del PR— para que el PR quede bloqueado en rojo en vez
  # de figurar como `skipped`, que GitHub cuenta como éxito en un check requerido.
  # Para validarlo, un mantenedor trae la rama al repositorio y abre el PR desde ahí.
  fork-guard:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    # Hospedado y no el propio: si la máquina del equipo está apagada el job
    # quedaría en cola sin fallar, y un PR de fork no tiene nada que hacer en
    # ella. Sin minutos de facturación el job muere al arrancar, que también es
    # rojo: el resultado es el mismo.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR desde fork — no se ejecuta en el runner propio
        run: |
          echo "::error::PR desde un fork: su código no se ejecuta en el runner self-hosted. Un mantenedor debe traer la rama al repositorio. Ver docs/operations/ci-runner-self-hosted.md"
          exit 1

  docs:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Runner self-hosted: los minutos de GitHub están agotados por facturación
    # desde el 14/08 y los jobs morían en 2 s sin máquina, así que ~30 PRs
    # entraron sin un solo check. `marcelo-wsl-api` es Linux con Docker, que es
    # lo que exigen los `services:` de acá abajo. Cuando la facturación se
    # reponga, volver a `ubuntu-latest` es cambiar esta línea.
    # Detalles y recuperación: docs/operations/ci-runner-self-hosted.md
    # Vuelta a runners hospedados (18/09/2026). El runner propio dejó de tomar
    # trabajos: las corridas de los PR #417 a #421 quedaron en cola sin ejecutar
    # y el equipo mergeó sin un solo check. Requiere que la facturación de
    # Actions esté al día; si no lo está, el job muere al arrancar —que también
    # es rojo, pero honesto— en vez de quedar en cola invisible.
    # Ver docs/operations/ci-runner-self-hosted.md
    runs-on: ubuntu-latest
    env:
      # El heap por defecto de Node (~2 GB) no alcanza en este repositorio. El
      # lint type-aware sobre 60 módulos y ~1185 entidades muere con "JavaScript
      # heap out of memory" (exit 129) antes de emitir un solo diagnóstico, y la
      # generación del contrato arranca AppModule entero, que es aún más pesado.
      # Se declara a nivel de job y no en un paso para que build, lint, pruebas y
      # generación compartan el mismo techo y no haya que descubrirlo dos veces.
      NODE_OPTIONS: --max-old-space-size=6144
    # Réplica de los almacenes reales de docker-compose.yml — necesarios porque
    # generar el contrato OpenAPI arranca AppModule completo (los 60 módulos,
    # incluidos document_store/redis_runtime/search_platform/object_storage).
    # Imagen de Postgres = timescale/timescaledb-ha (no postgres genérico): el
    # módulo time_series depende de extensiones de TimescaleDB.
    #
    # ADVERTENCIA HONESTA: este workflow no se ejecutó ni se verificó contra un
    # runner real de GitHub Actions durante esta auditoría (sin acceso a CI real
    # desde este entorno) — está construido por fidelidad a docker-compose.yml,
    # no probado end-to-end. Verificar en el primer PR real que lo dispare.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_USER: mantra
          POSTGRES_PASSWORD: mantra
          POSTGRES_DB: mantra_redesa_health
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mantra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:3.7.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          # Medio giga en vez del gigabyte por defecto. Acá OpenSearch solo
          # tiene que existir para que AppModule levante y se genere el
          # contrato: no se indexa nada ni se consulta nada pesado. En el
          # runner propio, que comparte memoria con lo que el equipo tenga
          # abierto, pedir 1 GB de heap es lo que lo dejaba sin arrancar.
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 120s

    steps:
      # Acciones fijadas a commit (MCH-031): una etiqueta se puede mover, un SHA no.
      # Resueltos con `git ls-remote` el 18/09/2026; son el mismo commit al que
      # apuntaban las etiquetas mayores usadas antes, así que no cambia nada de lo
      # que se ejecuta. Actualizar = cambiar SHA y comentario en un PR revisable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # El token no queda guardado en .git/config del workspace, que en un
          # runner propio persiste entre jobs.
          persist-credentials: false
          # Historial completo: `agenda-mensajeria-relacion` (H2.S1.M1) verifica
          # con `git merge-base --is-ancestor` un commit de septiembre, que en un
          # clon superficial no es alcanzable.
          fetch-depth: 0

      # Corepack ANTES de `setup-node`, y no después: `cache: yarn` hace que la
      # acción invoque `yarn cache dir` durante su propio paso, y el yarn global
      # del runner es el 1.22. Como el `package.json` declara
      # `packageManager: yarn@4.14.1`, ese yarn 1.22 aborta y el job muere en el
      # setup, antes de compilar nada. Usa el Node preinstalado del runner, que
      # es suficiente para activar los shims.
      #
      # Los shims van a un directorio del propio job y no al `bin` del Node
      # global: `corepack enable` a secas escribe en `/usr/bin`, que en un runner
      # hospedado pertenece al usuario del runner y en el propio no. Ahí moría
      # con `EACCES: permission denied, symlink … -> '/usr/bin/pnpm'`, en el paso
      # 4 de 30, dejando los otros 26 en `skipped` — o sea sin instalar
      # dependencias ni mirar una línea de código.
      #
      # `$RUNNER_TEMP` es escribible por definición y se limpia solo entre jobs,
      # así que esto sigue siendo correcto el día que se vuelva a `ubuntu-latest`.
      #
      # El `mkdir` no sobra: corepack no crea el directorio de destino, hace
      # `realpath` sobre él y muere con `ENOENT` si no existe.
      - name: Habilitar Corepack
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: yarn

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Levantar MinIO
        # MinIO no admite un command propio dentro de `services:` (solo el CMD
        # por defecto de la imagen) — se levanta con `docker run` en vez de
        # como service container.
        #
        # La imagen es la misma build de MinIO (RELEASE.2025-04-22T22-12-26Z)
        # publicada por Bitnami, fijada por digest. La de siempre
        # (`quay.io/minio/minio`) dejó de ser pública: desde el 24/09 quay pide
        # autenticación y `minio/minio` ya no existe en Docker Hub, así que todo
        # PR moría acá con `unauthorized` (exit 125). Es una sustitución de
        # infraestructura externa, no un cambio funcional: mismo puerto, mismas
        # credenciales, mismo healthcheck. Bitnami arranca el servidor con su
        # propio script (datos en /bitnami/minio/data), por eso no lleva el
        # argumento `server /data`. `bitnamilegacy` ya no se actualiza: el digest
        # la vuelve inmutable, que es lo que un fixture de CI necesita.
        #
        # El `rm -f` de arriba no es defensivo porque sí: en un runner propio los
        # contenedores **sobreviven al job**, y este no es un service container
        # que el runner limpie. El primer job que muriera antes del `rm` de abajo
        # dejaba un `minio` parado, y a partir de ahí TODA corrida del repo
        # fallaba acá con `Conflict. The container name "/minio" is already in
        # use` (exit 125), en el paso 7 de 30 y dejando los otros 23 en
        # `skipped`. Pasó el 18/08: se llevó puestos los PRs #142, #149 y #150.
        #
        # No alcanza con limpiar al final: el job puede morir sin llegar ahí
        # —cancelado, sin recursos, con la máquina apagada—, que es exactamente
        # como se generó el contenedor huérfano. Por eso el arreglo va al
        # principio, donde el estado sucio ya existe y hay que tolerarlo.
        run: |
          docker rm -f minio 2>/dev/null || true
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=mantra -e MINIO_ROOT_PASSWORD=mantra12345678 \
            docker.io/bitnamilegacy/minio:2025.4.22@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done

      - name: Instalar dependencias Node
        run: yarn install --immutable

      - name: Instalar dependencias de documentación (MkDocs)
        run: pip install -r docs/requirements.txt

      - name: Compilar
        run: yarn build

      - name: Verificar tipos
        run: yarn typecheck

      - name: Lint TypeScript — cero errores y cero advertencias
        run: yarn lint --max-warnings=0

      - name: Auditoría de dependencias runtime — sin vulnerabilidades conocidas
        run: yarn npm audit --all --recursive --environment production

      - name: Guardrails ALOVIDA — antipatrones prohibidos por las reglas canónicas
        run: yarn alovida:guardrails

      # O3-3 / H-1: ningún endpoint de escritura sin @Roles, @Public ni revisión documentada.
      - name: ORPHAN_ENDPOINT — mutantes sin @Roles, @Public ni revisión documentada
        run: |
          node --test tools/alovida/coverage-report.test.mjs
          node tools/alovida/coverage-report.mjs --fail-on-orphan

      # El inventario (`inventario/`, `docs/inventario/`) se genera desde el código Y
      # desde el repo del modelo (propósito, dominio y tablas de cada módulo), así que
      # verificarlo exige tener el modelo al lado. El repo es público: no hace falta
      # token. Va fijado a un commit y no a `dev`: el inventario versionado es función
      # del código de este PR y de ese commit del modelo, y un cambio ajeno del modelo
      # no debe poner en rojo un PR que no lo toca. Subirlo = regenerar el inventario
      # (`yarn inventario:endpoints`, `:flujos` y `:catalogo` con
      # MODEL_ROOT y FRONT_ROOT) y cambiar este SHA en el mismo PR.
      - name: Modelo de datos — insumo del inventario (commit fijado)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: mantra-core-technologies/mantra-core-health-model
          ref: 9feb64abc688b96092801b5acbd91b8dcdf8d9c0
          path: _modelo
          persist-credentials: false

      # El frontend aporta su glosario y su inventario de clientes HTTP (solo esos dos
      # archivos: sparse-checkout). Mismo criterio: commit fijado. Sin él, el inventario
      # regenerado diría «sin dato» donde el versionado trae el cruce, y no coincidiría.
      - name: Frontend — glosario e inventario de clientes (commit fijado)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: mdavila-2001/mantra-core-health
          ref: 667aa525b1865338a94aedc4d617f3b27a257a59
          path: _frontend
          persist-credentials: false
          sparse-checkout: |
            docs/business/glossary.md
            docs/reports/generated/api-inventory.md
          sparse-checkout-cone-mode: false

      # Regenerar el inventario con los generadores del repo y comparar con lo
      # versionado: un endpoint, un flujo o una tabla del catálogo que cambió sin que
      # el inventario viaje en el mismo PR deja el paso en rojo, y dice cuál.
      - name: Inventario al día — lo versionado coincide con el código y el modelo
        env:
          MODEL_ROOT: ${{ github.workspace }}/_modelo
          FRONT_ROOT: ${{ github.workspace }}/_frontend
        run: yarn inventario:verificar

      # Las pruebas de los generadores del inventario (121+ casos: árboles de decisión,
      # máquinas de estado, requerimientos, catálogo) corren contra el código real y el
      # modelo fijado arriba. Bloquean: una expectativa que el código dejó atrás se
      # actualiza en el mismo PR que mueve el código.
      - name: Pruebas del inventario
        env:
          MODEL_ROOT: ${{ github.workspace }}/_modelo
          FRONT_ROOT: ${{ github.workspace }}/_frontend
        run: yarn inventario:test

      # El DDL canónico se edita en `../SQL`, fuera del repositorio, y el
      # despliegue monta la copia versionada de `database/`. Aquí solo se clona
      # este repositorio, así que no hay con qué comparar: lo que se comprueba
      # es que la copia existe y tiene contenido. Sin ella, un despliegue
      # arranca con `/init/SQL` vacío, la base queda sin una sola tabla y la
      # aplicación devuelve 500 en la primera escritura — y lo hace en el
      # servidor, no aquí. Ver `database/README.md`.
      - name: DDL versionado — la copia de database/ está y no está vacía
        run: yarn db:vendor:check

      # MCH-024 — antes corría `yarn test` a secas: la cobertura sólo se medía
      # cuando alguien se acordaba de correr `test:cov` a mano, y nunca contra
      # el candidato real de un PR. `test:cov` corre exactamente las mismas
      # pruebas (mismo comando base, `--coverage` de más) y hace fallar el job
      # si el candidato queda por debajo de `coverageThreshold` — el trinquete
      # que MCH-024 fija sobre el valor medido.
      #
      # Sin `--runInBand`: en un solo proceso, las ~680 suites con cobertura
      # acumulan módulos VM de ESM hasta pasar los 6 GB de NODE_OPTIONS y el
      # job muere por falta de heap (run 35449865820). Con los workers de la
      # config de jest (`maxWorkers: 4`, `workerIdleMemoryLimit: 768MB`) cada
      # worker se recicla antes de crecer, y la cobertura se fusiona igual.
      - name: Pruebas unitarias con cobertura — no puede bajar del umbral fijado
        run: yarn test:cov

      # Los cuerpos de request del contrato: homónimos desambiguados y
      # `additionalProperties: false` desde `class-validator`. Va antes de
      # generar: si el arreglo está roto, el contrato saldría mintiendo.
      - name: Pruebas de los cuerpos de request del contrato OpenAPI
        run: yarn docs:openapi:request-bodies:test

      - name: Generar contrato OpenAPI real desde el código
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mantra
          DB_PASSWORD: mantra
          DB_NAME: mantra_redesa_health
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: mantra
          POSTGRES_PASSWORD: mantra
          POSTGRES_DB: mantra_redesa_health
          MONGODB_URI: mongodb://localhost:27017/mantra_redesa_health_document_store
          MONGO_DB: mantra_redesa_health_document_store
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENSEARCH_NODE: http://localhost:9200
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: mantra
          MINIO_SECRET_KEY: mantra12345678
          MINIO_BUCKET: mantra-redesa-health-files-ci
          JWT_SECRET: ci-only-secret-not-a-real-credential
          MFA_ENCRYPTION_KEY: ci-only-secret-not-a-real-credential
        run: node tools/openapi/generate-openapi.mjs

      # Deriva de permisos (`computePermissionDrift`, la misma lógica de la consola
      # `GET /admin/catalog/permission-drift`): lo que las rutas exigen con `@Roles`
      # contra lo que la API siembra. Es un trinquete: la deriva que ya existe está en
      # `tools/catalog/permission-drift-allowlist.json` y no bloquea; una ruta
      # autenticada nueva sin `@Roles`, o un rol nuevo que nadie siembra, sí. Una
      # excepción que dejó de hacer falta también falla, para que la lista sólo se
      # encoja. Arranca AppModule, igual que el paso anterior: mismo entorno.
      - name: Deriva de permisos — sin rutas ni roles nuevos fuera de la lista
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mantra
          DB_PASSWORD: mantra
          DB_NAME: mantra_redesa_health
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: mantra
          POSTGRES_PASSWORD: mantra
          POSTGRES_DB: mantra_redesa_health
          MONGODB_URI: mongodb://localhost:27017/mantra_redesa_health_document_store
          MONGO_DB: mantra_redesa_health_document_store
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENSEARCH_NODE: http://localhost:9200
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: mantra
          MINIO_SECRET_KEY: mantra12345678
          MINIO_BUCKET: mantra-redesa-health-files-ci
          JWT_SECRET: ci-only-secret-not-a-real-credential
          MFA_ENCRYPTION_KEY: ci-only-secret-not-a-real-credential
        run: yarn catalog:permission-drift

      # El Postgres de `services:` arranca vacío, y nada lo llenaba: "Generar
      # contrato" corre con ORM_SCHEMA_SYNC=off (tools/openapi/generate-openapi.mjs
      # lo fuerza), así que no crea una sola tabla. Por eso la suite de
      # integración moría en la primera siembra con `relation
      # "terminology.terminology_sources" does not exist` (run 35450632863).
      #
      # Se aplica el mismo DDL que el stack local, con el mismo script y la
      # misma imagen que `postgres-init` de docker-compose: `database/SQL`
      # (apply_all + FK diferidas + patches) y las extensiones de `database/NoSQL`.
      # `db:vendor:check` ya garantizó más arriba que esa copia existe.
      # `--add-host postgres:127.0.0.1` porque el script apunta al host
      # `postgres` de la red de compose; acá el servicio escucha en localhost.
      - name: Materializar el esquema — DDL versionado de database/
        run: |
          docker run --rm --network host --add-host postgres:127.0.0.1 \
            -e POSTGRES_DB=mantra_redesa_health \
            -e POSTGRES_USER=mantra -e POSTGRES_PASSWORD=mantra \
            -v "$PWD/database/SQL:/init/SQL:ro" \
            -v "$PWD/database/NoSQL:/init/NoSQL:ro" \
            -v "$PWD/docker/db-init:/init/bin:ro" \
            --entrypoint bash timescale/timescaledb-ha:pg18 /init/bin/init-postgres.sh

      # Va DESPUÉS de materializar el esquema: sin los 58 esquemas de negocio no
      # hay nada sobre lo que otorgar privilegios.
      #
      # Las contraseñas son literales contra una base efímera que muere con el
      # runner. No son secretos, y guardarlas como tales daría a entender que
      # protegen algo.
      - name: Aprovisionar roles de aplicación PostgreSQL
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mantra
          DB_PASSWORD: mantra
          DB_NAME: mantra_redesa_health
          POSTGRES_WRITER_PASSWORD: ci-writer-ephemeral
          POSTGRES_READER_PASSWORD: ci-reader-ephemeral
        run: yarn db:provision:dev

      # Verificación real del mínimo privilegio (§54): no inspecciona los GRANT
      # del catálogo, ejecuta las operaciones y exige 42501. Corre primero y
      # sola porque es la más barata y la más específica: si el rol de
      # aplicación quedó mal aprovisionado, mejor enterarse acá que a mitad de
      # la suite completa de abajo.
      - name: Pruebas de privilegios — el lector no puede escribir
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mantra
          DB_PASSWORD: mantra
          DB_NAME: mantra_redesa_health
          POSTGRES_WRITER_PASSWORD: ci-writer-ephemeral
          POSTGRES_READER_PASSWORD: ci-reader-ephemeral
        run: yarn test:integration --testPathPatterns=postgres-privileges

      # MCH-026 — hasta acá esto era lo único que corría de integración: un
      # filtro de un solo archivo. Las otras 93 suites (RLS por tenant, DI
      # entre los 60 módulos, contratos HTTP, jobs, FKs) no se ejecutaban en
      # ningún merge — sólo en la máquina de quien se acordara de correrlas.
      #
      # Va DESPUÉS de "Materializar el esquema": sin el DDL aplicado no hay
      # nada sobre lo que una migración o una consulta puedan operar.
      #
      # `--ci` evita que Jest intente escribir snapshots nuevos en un runner
      # efímero (fallaría igual, pero con un mensaje que no dice por qué).
      # En serie por `maxWorkers: 1` de `test/jest-integration.json`: las
      # suites comparten la misma base y no se truncan entre corridas (cada una
      # sufija sus propios datos), así que correrlas en paralelo arriesgaría
      # que una lea filas a medio escribir de otra. Pero SIN `--runInBand`:
      # cada suite arranca AppModule entero y, en el proceso principal, la
      # memoria se acumula hasta pasar los 6 GB (run 35452830577 murió así a
      # mitad de camino). Con `workerIdleMemoryLimit` Jest corre ese único
      # worker aparte y lo recicla entre suites.
      #
      # Corre COMPLETA en cada PR, no un subconjunto: es el único gate de
      # integración que existe hoy — `dev`/`master` no exigen ningún check
      # (ver LEEME-PRIMERO) — y recortarla dejaría exactamente el hueco que
      # esta ficha vino a cerrar. Si en un runner hospedado real el tiempo o
      # el costo de Actions la vuelve impracticable por PR, la salida
      # documentada (no aplicada acá) es partirla en un subconjunto rápido por
      # PR y la completa contra `dev`; no se tocan los triggers de este
      # workflow en esta ficha porque es justo lo que el PR #424 tiene en
      # danza. Detalle y comandos equivalentes para correrla fuera de CI en
      # docs/operations/ci-integration-recipe.md.
      - name: Suite de integración completa (MCH-026)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mantra
          DB_PASSWORD: mantra
          DB_NAME: mantra_redesa_health
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: mantra
          POSTGRES_PASSWORD: mantra
          POSTGRES_DB: mantra_redesa_health
          MONGODB_URI: mongodb://localhost:27017/mantra_redesa_health_document_store
          MONGO_DB: mantra_redesa_health_document_store
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENSEARCH_NODE: http://localhost:9200
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: mantra
          MINIO_SECRET_KEY: mantra12345678
          MINIO_BUCKET: mantra-redesa-health-files-ci
          JWT_SECRET: ci-only-secret-not-a-real-credential
          MFA_ENCRYPTION_KEY: ci-only-secret-not-a-real-credential
          # El Postgres de `services:` es efímero aunque se llame como el de
          # desarrollo; sin esto `lane16-patient-invoice-flow` se niega a correr
          # (deja historial de sólo inserción: ver test/integration/disposable-database.ts).
          ALLOW_PERMANENT_TEST_RESIDUE: "yes"
        run: yarn test:integration --ci

      # H-6 · la API compilada ARRANCA y responde, no sólo compila. Levanta
      # `dist/src/main.js` (lo que despliega la imagen) contra los mismos
      # almacenes de `services:` y el esquema ya materializado, y corre la misma
      # prueba de humo que se lanza tras cada despliegue
      # (`scripts/smoke/post-deploy-smoke.mjs`): /health y /readiness en 200 con
      # `status: ok`. Sin cuentas de prueba sembradas no hace login: eso queda
      # para el humo contra un entorno desplegado (SMOKE_ACCOUNTS).
      #
      # El arranque siembra el catálogo núcleo (SEED_ON_BOOT por defecto), por eso
      # la espera de /health es generosa. Si falla, el paso imprime el final del
      # log de la API: la causa de un arranque roto está ahí, no en el humo.
      - name: Arranque real de la API y prueba de humo (/health, /readiness)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mantra
          DB_PASSWORD: mantra
          DB_NAME: mantra_redesa_health
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: mantra
          POSTGRES_PASSWORD: mantra
          POSTGRES_DB: mantra_redesa_health
          MONGODB_URI: mongodb://localhost:27017/mantra_redesa_health_document_store
          MONGO_DB: mantra_redesa_health_document_store
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENSEARCH_NODE: http://localhost:9200
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: mantra
          MINIO_SECRET_KEY: mantra12345678
          MINIO_BUCKET: mantra-redesa-health-files-ci
          JWT_SECRET: ci-only-secret-not-a-real-credential
          MFA_ENCRYPTION_KEY: ci-only-secret-not-a-real-credential
          PORT: "3000"
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_WAIT_SECONDS: "300"
        run: |
          node dist/src/main.js > "$RUNNER_TEMP/api-smoke.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api-smoke.pid"
          if ! node scripts/smoke/post-deploy-smoke.mjs; then
            echo "::error::La API no pasó la prueba de humo. Últimas líneas de su log:"
            tail -n 200 "$RUNNER_TEMP/api-smoke.log"
            exit 1
          fi

      - name: Detener la API de la prueba de humo
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api-smoke.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/api-smoke.pid")" 2>/dev/null || true
          fi

      - name: Generar documentación detallada de endpoints
        run: yarn docs:endpoints:generate

      - name: Lint del contrato OpenAPI (Redocly) — 0 errores obligatorio
        run: yarn docs:openapi:lint

      # Aquí había un paso de "breaking changes" que corría `npx --yes
      # @redocly/cli diff`: bajaba de npm la última versión de la CLI —fuera del
      # lockfile— y la ejecutaba en el runner propio en cada PR (MCH-031), para un
      # subcomando que Redocly CLI no tiene (la 2.43.2 del lockfile no lo lista), así
      # que siempre terminaba en warning. No era un control.
      #
      # MCH-025 — reemplazo real y bloqueante, resuelto por el lockfile (nada
      # nuevo: sólo node:fs/node:assert). `tools/openapi/check-breaking.mjs`
      # compara el `openapi.json` de esta rama contra el de la rama destino y
      # falla si hay ruta/operación/código de respuesta eliminado, campo nuevo
      # obligatorio en un request, propiedad eliminada de una response o un
      # cambio de tipo. Sus propias pruebas van primero: si el detector está
      # roto, el job tiene que fallar ahí y no fingir un "sin cambios" corriente
      # abajo.
      - name: Pruebas del detector de cambios incompatibles de OpenAPI (MCH-025)
        run: yarn docs:openapi:check-breaking:test

      # `github.base_ref` sólo existe en un `pull_request`; en `workflow_dispatch`
      # no hay rama destino contra la cual comparar y el paso no aplica.
      #
      # `git show origin/<base>:openapi/openapi.json` puede fallar por un motivo
      # legítimo (la rama base todavía no tiene contrato generado, p. ej. en el
      # primer PR que lo introduce) — eso es "no hay línea base", no "hay una
      # ruptura", así que se avisa con `::warning::` y se sigue, en vez de
      # bloquear un PR que no tiene con qué compararse ni de fingir que pasó
      # limpio un chequeo que nunca corrió.
      - name: Cambios incompatibles del contrato OpenAPI — bloqueante (MCH-025)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git show "origin/${{ github.base_ref }}:openapi/openapi.json" > /tmp/openapi-base.json 2>/tmp/openapi-base.err; then
            node tools/openapi/check-breaking.mjs \
              --base /tmp/openapi-base.json \
              --head openapi/openapi.json \
              --exceptions tools/openapi/breaking-changes-exceptions.json
          else
            echo "::warning::No hay openapi.json en origin/${{ github.base_ref }} para comparar; se omite el chequeo de cambios incompatibles. Detalle:"
            cat /tmp/openapi-base.err
          fi

      - name: Validar AsyncAPI — 0 errores obligatorio
        run: yarn docs:asyncapi:validate

      - name: Sincronizar documentación generada (módulos + catálogo de datos)
        run: |
          yarn docs:modules:sync
          yarn docs:data:sync

      - name: Regenerar la colección Postman desde el contrato
        run: yarn postman:generate

      - name: Verificar que los artefactos generados están versionados y al día
        run: |
          git diff --exit-code -- \
            openapi/openapi.yaml \
            openapi/openapi.json \
            openapi/ENDPOINTS.md \
            openapi/endpoints \
            docs/modules \
            docs/data \
            docs/postman

      - name: Cobertura documental — sin marcadores pendientes, sin páginas vacías, sin módulos sin documentar, sin planes ni pendientes
        run: |
          yarn docs:coverage:test
          yarn docs:coverage

      - name: Enlaces internos — sin enlaces rotos, sin páginas huérfanas
        run: yarn docs:links

      - name: Análisis de secretos en el contrato generado
        run: |
          if grep -qE "(BEGIN [A-Z ]*PRIVATE KEY|sk_live_|AKIA[0-9A-Z]{16})" openapi/openapi.yaml asyncapi/asyncapi.yaml; then
            echo "::error::Posible secreto detectado en el contrato generado"
            exit 1
          fi
          echo "Sin patrones de secreto conocidos en los contratos generados."

      - name: Construir portal MkDocs en modo estricto
        run: yarn docs:build

      # Antes exigía `push`, que no es un trigger de este workflow: el paso no se
      # ejecutaba nunca (MCH-032). Se publica en la corrida manual, que es la que se
      # lanza para obtener el portal; en los PRs no, para no subir un artefacto por
      # cada commit desde el runner propio. El nombre lleva el SHA validado.
      - name: Publicar artefactos de documentación
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site-${{ github.sha }}
          if-no-files-found: error
          path: |
            site/
            openapi/openapi.yaml
            openapi/openapi.json
            asyncapi/asyncapi.yaml
            coverage/coverage-summary.json
            coverage/lcov-report/
          retention-days: 30

      # `always()` para que corra también cuando el job falló o lo cancelaron:
      # dejar MinIO andando en un runner propio le come memoria a la corrida
      # siguiente —que comparte máquina con el stack de desarrollo del equipo— y
      # le retiene el 9000. Los service containers de `services:` los limpia el
      # runner; este, levantado a mano, es nuestro.
      #
      # El paso de arriba igual empieza con `rm -f`: esta limpieza es la que
      # mantiene la máquina ordenada, no la que garantiza que el próximo job
      # arranque.
      - name: Retirar MinIO
        if: always()
        run: docker rm -f minio 2>/dev/null || true
