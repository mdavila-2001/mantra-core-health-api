name: Documentación

# Fase 16 del plan de documentación. Convierte la documentación en parte
# obligatoria del producto: un PR que rompe el contrato OpenAPI/AsyncAPI, deja
# un enlace roto, o hace fallar `mkdocs build --strict`, no puede mergearse.
#
# Incluye build, tipos, lint, auditoría runtime, pruebas y contratos. El lint
# productivo es type-aware; los fixtures de prueba conservan una política
# específica para dobles parciales sin relajar ningún archivo de runtime.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  docs:
    runs-on: ubuntu-latest
    # Réplica de los almacenes reales de docker-compose.yml — necesarios porque
    # generar el contrato OpenAPI arranca AppModule completo (los 60 módulos,
    # incluidos document_store/redis_runtime/search_platform/object_storage).
    # Imagen de Postgres = timescale/timescaledb-ha (no postgres genérico): el
    # módulo time_series depende de extensiones de TimescaleDB.
    #
    # ADVERTENCIA HONESTA: este workflow no se ejecutó ni se verificó contra un
    # runner real de GitHub Actions durante esta auditoría (sin acceso a CI real
    # desde este entorno) — está construido por fidelidad a docker-compose.yml,
    # no probado end-to-end. Verificar en el primer PR real que lo dispare.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_USER: mantra
          POSTGRES_PASSWORD: mantra
          POSTGRES_DB: mantra_redesa_health
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mantra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:3.7.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Levantar MinIO
        # MinIO no admite un command propio dentro de `services:` (solo el CMD
        # por defecto de la imagen, que requiere el argumento `server /data`) —
        # se levanta con `docker run` en vez de como service container.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=mantra -e MINIO_ROOT_PASSWORD=mantra12345678 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done

      - name: Instalar dependencias Node
        run: yarn install --immutable

      - name: Instalar dependencias de documentación (MkDocs)
        run: pip install -r docs/requirements.txt

      - name: Compilar
        run: yarn build

      - name: Verificar tipos
        run: yarn typecheck

      - name: Lint TypeScript — cero errores y cero advertencias
        run: yarn lint --max-warnings=0

      - name: Auditoría de dependencias runtime — sin vulnerabilidades conocidas
        run: yarn npm audit --all --recursive --environment production

      - name: Pruebas unitarias
        run: yarn test

      - name: Generar contrato OpenAPI real desde el código
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: mantra
          DB_PASSWORD: mantra
          DB_NAME: mantra_redesa_health
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: mantra
          POSTGRES_PASSWORD: mantra
          POSTGRES_DB: mantra_redesa_health
          MONGODB_URI: mongodb://localhost:27017/mantra_redesa_health_document_store
          MONGO_DB: mantra_redesa_health_document_store
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENSEARCH_NODE: http://localhost:9200
          MINIO_ENDPOINT: localhost
          MINIO_PORT: "9000"
          MINIO_ACCESS_KEY: mantra
          MINIO_SECRET_KEY: mantra12345678
          MINIO_BUCKET: mantra-redesa-health-files-ci
          JWT_SECRET: ci-only-secret-not-a-real-credential
          MFA_ENCRYPTION_KEY: ci-only-secret-not-a-real-credential
        run: node tools/openapi/generate-openapi.mjs

      - name: Generar documentación detallada de endpoints
        run: yarn docs:endpoints:generate

      - name: Lint del contrato OpenAPI (Redocly) — 0 errores obligatorio
        run: yarn docs:openapi:lint

      - name: Detección de breaking changes del contrato
        # Compara el contrato generado en este PR contra el de la rama base.
        # No falla el job si no hay contrato base (primera vez) — informa, no bloquea,
        # hasta que exista un baseline real con el que comparar.
        run: |
          git fetch origin ${{ github.base_ref || 'master' }} --depth=1 || true
          if git show origin/${{ github.base_ref || 'master' }}:openapi/openapi.yaml > /tmp/base-openapi.yaml 2>/dev/null; then
            npx --yes @redocly/cli diff /tmp/base-openapi.yaml openapi/openapi.yaml || \
              echo "::warning::El contrato OpenAPI cambió respecto a ${{ github.base_ref || 'master' }} — revisar si es incompatible."
          else
            echo "Sin contrato base para comparar (rama nueva o primera generación)."
          fi

      - name: Validar AsyncAPI — 0 errores obligatorio
        run: yarn docs:asyncapi:validate

      - name: Sincronizar documentación generada (módulos + catálogo de datos)
        run: |
          yarn docs:modules:sync
          yarn docs:data:sync

      - name: Verificar que los artefactos generados están versionados y al día
        run: |
          git diff --exit-code -- \
            openapi/openapi.yaml \
            openapi/openapi.json \
            openapi/ENDPOINTS.md \
            openapi/endpoints \
            docs/modules \
            docs/data

      - name: Cobertura documental — sin marcadores pendientes, sin páginas vacías, sin módulos sin documentar
        run: yarn docs:coverage

      - name: Enlaces internos — sin enlaces rotos, sin páginas huérfanas
        run: yarn docs:links

      - name: Análisis de secretos en el contrato generado
        run: |
          if grep -qE "(BEGIN [A-Z ]*PRIVATE KEY|sk_live_|AKIA[0-9A-Z]{16})" openapi/openapi.yaml asyncapi/asyncapi.yaml; then
            echo "::error::Posible secreto detectado en el contrato generado"
            exit 1
          fi
          echo "Sin patrones de secreto conocidos en los contratos generados."

      - name: Construir portal MkDocs en modo estricto
        run: yarn docs:build

      - name: Publicar artefactos de documentación
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: |
            site/
            openapi/openapi.yaml
            openapi/openapi.json
            asyncapi/asyncapi.yaml
          retention-days: 30
