# Prometheus del VPS. Las alertas viven en rules/ y las despacha Alertmanager.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    server: contabo-vps

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Las series del cgroup raíz y de los slices de systemd no son contenedores.
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: docker-state
    static_configs:
      - targets: ["telegram-bot:9200"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Sondas desde adentro del VPS hacia los sitios públicos. Si el VPS entero se
  # cae, estas sondas caen con él: de eso se encarga el latido a Healthchecks.io.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://test.173.249.39.237.sslip.io/
          - https://demo.alovidasalud.arauzsoftware.com/
          - http://173.249.39.237:8000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
