# Los sitios públicos, vistos como los ve un usuario. Fuente: blackbox-exporter.
groups:
  - name: endpoints
    rules:
      - alert: EndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} NO responde"
          description: "Falla hace más de 2 min. Si coincide con un despliegue de Coolify, es la ventana del despliegue."

      - alert: EndpointSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} tarda {{ $value | humanize }} s en responder"
          description: "Más de 5 s sostenido durante 10 min."

      - alert: TlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "El certificado de {{ $labels.instance }} vence en {{ $value | humanizeDuration }}"
          description: "Traefik/Let's Encrypt debería renovarlo solo; si no lo hizo, revisar Coolify."
