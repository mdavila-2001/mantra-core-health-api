# promtool test rules prometheus/tests/rules_test.yml
# Series sintéticas → se comprueba que cada alerta salte (o NO salte) a tiempo.
rule_files:
  - ../rules/host.yml
  - ../rules/containers.yml
  - ../rules/endpoints.yml
  - ../rules/watchdog.yml
  - ../rules/traffic.yml

evaluation_interval: 30s

tests:
  - name: RAM baja avisa a los 5 min, no antes; crítica a los 2 min
    interval: 30s
    input_series:
      - series: 'node_memory_MemTotal_bytes{instance="n"}'
        values: '100x30'
      - series: 'node_memory_MemAvailable_bytes{instance="n"}'
        values: '10x14 5x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: HostMemoryLow
        exp_alerts: []
      - eval_time: 6m
        alertname: HostMemoryLow
        exp_alerts:
          - exp_labels: { severity: warning, instance: n }
            exp_annotations:
              summary: "RAM del VPS baja: queda 10% disponible"
              description: "Menos del 15 % de la RAM libre durante 5 min. Mirá /ram para ver qué contenedor la está usando."
      - eval_time: 10m
        alertname: HostMemoryCritical
        exp_alerts:
          - exp_labels: { severity: critical, instance: n }
            exp_annotations:
              summary: "RAM del VPS CRÍTICA: queda 5% disponible"
              description: "Con menos del 8 % libre, el kernel empieza a matar procesos (OOM)."

  - name: Contenedor unhealthy salta a los 3 min; uno sano no
    interval: 30s
    input_series:
      - series: 'alovida_container_unhealthy{name="api-1",display="alovida-backend-central/api"}'
        values: '1x10'
      - series: 'alovida_container_unhealthy{name="redis-1",display="alovida-backend-central/redis"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: ContainerUnhealthy
        exp_alerts: []
      - eval_time: 4m
        alertname: ContainerUnhealthy
        exp_alerts:
          - exp_labels: { severity: critical, name: api-1, display: alovida-backend-central/api }
            exp_annotations:
              summary: "alovida-backend-central/api está UNHEALTHY"
              description: "Su healthcheck falla hace más de 3 min. Si tiene la etiqueta autoheal=true, autoheal lo reinicia solo."

  - name: Avisa si un contenedor que corría se detiene; no por restos viejos ni one-shots
    interval: 1m
    input_series:
      - series: 'alovida_container_running{name="api-migrate",display="x/api-migrate"}'
        values: '1 1 0 0 0 0 0'
      - series: 'alovida_container_expected_running{name="api-migrate",display="x/api-migrate"}'
        values: '0x6'
      - series: 'alovida_container_running{name="minio",display="x/minio"}'
        values: '1 1 0 0 0 0 0'
      - series: 'alovida_container_expected_running{name="minio",display="x/minio"}'
        values: '1x6'
      - series: 'alovida_container_running{name="viejo",display="x/viejo"}'
        values: '0x6'
      - series: 'alovida_container_expected_running{name="viejo",display="x/viejo"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: ContainerDown
        exp_alerts:
          - exp_labels: { severity: critical, name: minio, display: x/minio }
            exp_annotations:
              summary: "x/minio se DETUVO"
              description: "Estaba corriendo hace menos de 15 min, tiene política de reinicio y ahora está parado. Si no fue un despliegue o una parada a mano, revisalo."

  - name: Más de 3 reinicios en 15 min es un bucle
    interval: 1m
    input_series:
      - series: 'alovida_container_started_at_seconds{name="w",display="x/worker"}'
        values: '100 160 220 280 340 400'
    alert_rule_test:
      - eval_time: 3m
        alertname: ContainerRestartLoop
        exp_alerts: []
      - eval_time: 5m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels: { severity: critical, name: w, display: x/worker }
            exp_annotations:
              summary: "x/worker se reinició 5 veces en 15 min"
              description: "Bucle de reinicios: arranca, muere y vuelve a arrancar."

  - name: Contenedor sin límite de memoria no dispara la alerta de límite
    interval: 30s
    input_series:
      - series: 'container_memory_working_set_bytes{name="pg"}'
        values: '1000x12'
      - series: 'container_spec_memory_limit_bytes{name="pg"}'
        values: '0x12'
      - series: 'container_memory_working_set_bytes{name="api"}'
        values: '95x12'
      - series: 'container_spec_memory_limit_bytes{name="api"}'
        values: '100x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels: { severity: warning, name: api }
            exp_annotations:
              summary: "api usa el 95% de su límite de memoria"
              description: "Al llegar al 100 % el kernel lo mata (OOM)."

  - name: Sitio caído 2 min
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-http",instance="https://test.example/"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: EndpointDown
        exp_alerts:
          - exp_labels: { severity: critical, job: blackbox-http, instance: "https://test.example/" }
            exp_annotations:
              summary: "https://test.example/ NO responde"
              description: "Falla hace más de 2 min. Si coincide con un despliegue de Coolify, es la ventana del despliegue."

  - name: El latido está siempre activo
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: { severity: none }
            exp_annotations:
              summary: "Latido del monitoreo (siempre activo, no es un problema)"

  - name: 5xx de un sitio avisa con el dominio, no con el uuid del router
    interval: 30s
    input_series:
      # 60 pedidos/min, 6 de ellos 5xx (10 %) desde el minuto 0.
      - series: 'traefik_router_requests_total{router="https-0-abc-proxy@docker",code="200"}'
        values: '0+27x40'
      - series: 'traefik_router_requests_total{router="https-0-abc-proxy@docker",code="502"}'
        values: '0+3x40'
      - series: 'alovida_router_info{router="https-0-abc-proxy@docker",site="test.example"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: SiteErrors5xx
        exp_alerts: []
      - eval_time: 12m
        alertname: SiteErrors5xx
        exp_alerts:
          - exp_labels: { severity: warning, router: "https-0-abc-proxy@docker", site: test.example }
            exp_annotations:
              summary: "test.example: 10% de los pedidos dan error 5xx"
              description: "Más del 5 % de errores del servidor durante 5 min. /trafico muestra el detalle; los logs, en Coolify."
      - eval_time: 12m
        alertname: SiteErrors5xxCritical
        exp_alerts: []

  - name: un sitio casi sin tráfico no alerta por un error suelto
    interval: 30s
    input_series:
      # 1 pedido cada 5 min y siempre 502: tasa por debajo del mínimo.
      - series: 'traefik_router_requests_total{router="r@docker",code="502"}'
        values: '0+0.1x40'
      - series: 'alovida_router_info{router="r@docker",site="quieto.example"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: SiteErrors5xxCritical
        exp_alerts: []

  - name: latencia p95 alta sostenida 10 min
    interval: 30s
    input_series:
      # Todos los pedidos caen entre 3 y 5 s.
      - series: 'traefik_router_request_duration_seconds_bucket{router="r@docker",le="1.2"}'
        values: '0x40'
      - series: 'traefik_router_request_duration_seconds_bucket{router="r@docker",le="5"}'
        values: '0+30x40'
      - series: 'traefik_router_request_duration_seconds_bucket{router="r@docker",le="+Inf"}'
        values: '0+30x40'
      - series: 'traefik_router_requests_total{router="r@docker",code="200"}'
        values: '0+30x40'
      - series: 'alovida_router_info{router="r@docker",site="lento.example"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: SiteLatencyHigh
        exp_alerts: []
      - eval_time: 17m
        alertname: SiteLatencyHigh
        exp_alerts:
          - exp_labels: { severity: warning, router: "r@docker", site: lento.example }
            exp_annotations:
              summary: "lento.example lento: el 5 % más lento tarda 4.81 s"
              description: "Latencia p95 por encima de 2 s durante 10 min, medida en el proxy. /tablero muestra la tendencia."

  - name: proxy sin métricas
    interval: 30s
    input_series:
      - series: 'up{job="traefik",instance="coolify-proxy:8082"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: TraefikMetricsDown
        exp_alerts:
          - exp_labels: { severity: warning, job: traefik, instance: "coolify-proxy:8082" }
            exp_annotations:
              summary: "No llegan las métricas del proxy (Traefik)"
              description: "Prometheus no alcanza coolify-proxy:8082. Si el proxy se recreó, correr coolify-proxy-reconnect y revisar que el monitoreo siga en la red «coolify»."

