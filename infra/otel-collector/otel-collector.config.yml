# =========================================================================
# Mantra Core Technologies · ALOVIDA Health Ecosystem
# Configuración del OpenTelemetry Collector para STAGING y PRODUCCIÓN.
#
# Por qué existe: en producción los 21 procesos NO deben hablar directamente
# con Jaeger. El Collector es el amortiguador entre ambos —encola, reintenta,
# limita memoria y redacta atributos— de modo que una caída o una ralentización
# del backend de trazas no se convierta en presión sobre la aplicación.
#
# En desarrollo NO hace falta: `docker-compose.jaeger.yml` exporta directo a
# Jaeger all-in-one. Ver `docs/observability/03-production-topology.md`.
# =========================================================================

receivers:
  otlp:
    protocols:
      http:
        # Solo la red privada de aplicación. El Collector NUNCA se publica en
        # Internet: recibe telemetría sin autenticar y quien pudiera alcanzarlo
        # podría inyectar trazas falsas o saturar el almacenamiento.
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # PRIMERO en la cadena, siempre. Si el Collector se queda sin memoria porque
  # Jaeger no drena, este procesador rechaza lotes nuevos (backpressure) en vez
  # de que el proceso muera por OOM y pierda todo lo que tenía encolado.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Descarta las sondas de salud aunque un servicio mal configurado las envíe.
  # La aplicación ya las excluye en origen (`EXCLUDED_HTTP_PATHS`); esto es la
  # segunda barrera, la que no depende de que cada despliegue esté al día.
  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/health"'
        - 'attributes["url.path"] == "/healthz"'
        - 'attributes["url.path"] == "/metrics"'
        - 'attributes["url.path"] == "/ready"'

  # Red de seguridad de privacidad. La aplicación ya está configurada para no
  # emitir estos atributos; borrarlos aquí protege también de una instrumentación
  # de terceros que los añada en una actualización futura. En un sistema de
  # salud, "no lo emitimos" y "además lo borramos" no son redundantes.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - key: db.statement.parameters
        action: delete

  # Identifica de qué cluster/región viene cada traza, para poder separar
  # entornos que comparten backend de trazas.
  resource/environment:
    attributes:
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert

  # ÚLTIMO antes de exportar. Agrupa spans en lotes: sin él, cada span sería una
  # petición HTTP a Jaeger.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/jaeger:
    endpoint: ${env:JAEGER_COLLECTOR_ENDPOINT}
    tls:
      insecure: false
    # Reintento con cola en disco: una indisponibilidad de Jaeger de unos
    # minutos no pierde trazas, y sobre todo no propaga el fallo hacia atrás.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

extensions:
  # Sonda para el orquestador: permite reiniciar el Collector si deja de estar
  # sano, en vez de que se quede aceptando y descartando en silencio.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      # Métricas internas del propio Collector (spans recibidos, descartados,
      # reintentados). Es lo que responde "¿se están perdiendo trazas?".
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/health
        - attributes/redact
        - resource/environment
        - batch
      exporters: [otlp/jaeger]
