# =========================================================================
# Mantra Core Technologies · ALOVIDA
# Despliegue en un VPS gestionado por Coolify.
# -------------------------------------------------------------------------
# Este archivo NO es `docker-compose.yml`. Aquél levanta el entorno de
# desarrollo de la máquina de quien programa; éste levanta el sistema en un
# servidor. Las diferencias no son cosméticas y cada una viene de un modo de
# fallo concreto que se comprobó antes de escribirlas:
#
#  1. EL DDL SE MONTA DESDE `./database`, NO DESDE EL REPOSITORIO DEL MODELO.
#     Coolify clona ESTE repositorio y nada más.
#     `../mantra-core-health-model/SQL` es un repositorio HERMANO que en el
#     servidor no existe: el contenedor de inicialización arrancaba con
#     `/init/SQL` vacío, la base quedaba sin una sola tabla y la aplicación
#     devolvía 500 en la primera escritura. Que el modelo tenga repositorio
#     propio (B-2, commit 19ef5a17) arregla el versionado, no el despliegue.
#     `database/` es la copia versionada AQUÍ; se refresca con `yarn db:vendor`
#     y CI la verifica con `yarn db:vendor:check`. Desde el punto 7 no se monta:
#     viaja dentro de las imágenes `*-init`.
#
#  2. HAY UN PASO DE MIGRACIÓN EXPLÍCITO (`api-migrate`) ANTES DE LA API.
#     Medido contra una base recién construida desde `database/SQL` (modelo del
#     02/09/2026): **71 diferencias** entre el modelo y la base —45 tablas
#     ausentes, `pharma_lab` entero entre ellas (B-8, todavía abierto); 2
#     columnas; y 24 divergencias de obligatoriedad, columnas que la base exige
#     NOT NULL y la entidad declara opcionales—.
#     Las lecturas no se enteran, porque MikroORM proyecta `select "p0".*`;
#     **las altas sí**, porque un INSERT nombra cada columna. Es exactamente el
#     fallo que se arrastraba: «alta de paciente → 500, column "…" of relation
#     "…" does not exist».
#     `api-migrate` corre `seed-cli` con `ORM_SCHEMA_SYNC=safe` (aditivo, nunca
#     destructivo, con cerrojo de aviso) y deja la base en «1239 entidades
#     coinciden» —las 71 diferencias en cero, obligatoriedad incluida—, y de
#     paso siembra el catálogo. La API arranca después, con
#     `ORM_SCHEMA_SYNC=off`: en un servidor, quien toca la estructura es un paso
#     de despliegue con código de salida, no el proceso que sirve tráfico.
#
#  3. NINGÚN PUERTO SE PUBLICA EN EL HOST.
#     El proxy de Coolify (Traefik) llega a los contenedores por la red de
#     Docker. Publicar 5432 o 9200 en el VPS es exponer la base y el buscador
#     a Internet. Solo `api` se anuncia, y ni siquiera hace falta si el
#     frontend va delante (ver punto 5).
#
#  4. LOS SECRETOS DE PRODUCCIÓN ESTÁN COMPLETOS.
#     Con `NODE_ENV=production` hacen falta CINCO claves de 32+ caracteres:
#     `JWT_SECRET`, `MFA_ENCRYPTION_KEY`, `WEBHOOK_SIGNING_KEY`,
#     `DOWNLOAD_URL_SECRET` y `AUDIO_TTS_DATA_KEY`. Las tres últimas no
#     figuraban en el compose de desarrollo, así que un despliegue copiado de
#     allí moría en el arranque —«"WEBHOOK_SIGNING_KEY" is required»— sin
#     ninguna pista de por qué en desarrollo sí funcionaba.
#     `AUDIO_TTS_DATA_KEY` es la más desconcertante de las cinco: se exige
#     aunque la síntesis de voz esté APAGADA, porque quien la lee es el cifrador
#     que se instancia con el módulo (`loadAudioEnv`), no el proveedor.
#     Ver `.env.coolify.example`.
#
#  5. LA RED `alovida` LA CREA ESTE STACK, Y LA COMPARTE CON EL FRONTEND.
#     El frontend (`mantra-core-health`) sirve la API bajo el MISMO dominio a
#     través de su nginx —es la decisión de arquitectura del proyecto, y es lo
#     que permite que `PUBLIC_API_BASE_URL` quede vacía y que la API mantenga
#     `CORS` denegado por defecto (`main.ts`: `enableCors({ origin: false })`)—.
#     Para que aquel nginx alcance a este contenedor, los dos stacks comparten
#     una red con nombre fijo. La declara ESTE stack (abajo, sin `external`) y
#     el del frontend la toma como `external`. Así no hace falta ningún paso a
#     mano en el servidor, que es lo que se buscaba: con la API de Coolify se
#     crean recursos, no se ejecutan comandos.
#
#     ⚠️  Si alguien ya corrió `docker network create alovida`, este stack NO
#     arranca: «network alovida was found but has incorrect label
#     com.docker.compose.network set to ""». Se resuelve borrando la red a mano
#     (`docker network rm alovida`) y volviendo a desplegar — compose la crea
#     sola. El orden importa: este stack primero, el frontend después.
#
#  6. EL EMULADOR DE PROVEEDORES NO EXISTE AQUÍ.
#     `mock-provider-server` acepta TODA verificación de identidad y de
#     matrícula profesional. `assertMockProviderNotInProduction` aborta el
#     arranque de cualquier worker si `MOCK_PROVIDER_BASE_URL` trae valor en
#     producción; la variable se fija vacía explícitamente más abajo.
#
#  7. LOS `*-init` NO MONTAN NADA DEL REPOSITORIO: LO HORNEAN.
#     Coolify clona el repositorio DENTRO de un contenedor auxiliar
#     (`/artifacts/<uuid>`) y desde ahí lanza `docker compose up` contra el
#     socket del host. Un `volumes: ./docker/db-init:/init/bin` lo resuelve el
#     DEMONIO, que corre en el host y donde esa ruta NO existe: Docker crea el
#     directorio vacío y lo monta igual, sin avisar. El despliegue moría así:
#
#         bash: /init/bin/init-postgres.sh: No such file or directory
#         service "postgres-init" didn't complete successfully: exit 127
#
#     —127 es «orden no encontrada», y bash lo devuelve también cuando el
#     script que se le pasa no existe—. En local NO se reproduce, porque ahí el
#     demonio ve el mismo disco que el checkout; de ahí que el compose de
#     desarrollo siga montando el DDL y este NO pueda.
#
#     El contexto de build sí viaja del contenedor auxiliar al demonio, que es
#     como se construyen `api`, `api-migrate` y los workers. Por eso el script
#     y `database/` van dentro de la imagen: `docker/db-init/Dockerfile`, una
#     etapa por servicio. `minio-init` no aparece ahí porque su entrypoint es
#     literal en este archivo y no lee nada del repositorio.
#
# -------------------------------------------------------------------------
# RECURSOS. Con los 22 workers el stack pide del orden de **8 GB de RAM**.
# Para un VPS de 4 GB, comentar los servicios de la sección «WORKERS
# OPCIONALES»: la API y las altas funcionan sin ellos; lo que se pierde es el
# procesamiento en segundo plano de esos dominios.
# -------------------------------------------------------------------------
# Puesta en marcha en Coolify:
#   Nuevo recurso → Docker Compose → este repositorio, rama `dev`
#   Compose file: docker-compose.coolify.yml
#   Variables: copiar de `.env.coolify.example` (las marcadas OBLIGATORIA)
# Ver docs/operations/coolify.md para el paso a paso completo.
# =========================================================================

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"

  # --- PostgreSQL ---------------------------------------------------------
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_NAME: ${POSTGRES_DB}

  # --- Los otros cuatro motores ------------------------------------------
  MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-alovida_document_store}
  MONGO_DB: ${MONGO_DB:-alovida_document_store}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  OPENSEARCH_NODE: http://opensearch:9200
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-alovida-files}

  # --- Almacenamiento de archivos ----------------------------------------
  # `local` sobre un volumen persistente: un único proceso de API escribe, y el
  # volumen sobrevive al redespliegue. Para varias réplicas hay que pasar a
  # `s3`, porque un volumen local no se comparte entre contenedores.
  FILE_STORAGE_ADAPTER: ${FILE_STORAGE_ADAPTER:-local}
  FILE_STORAGE_LOCAL_DIR: ${FILE_STORAGE_LOCAL_DIR:-./storage/uploads}
  FILE_STORAGE_MAX_SIZE_BYTES: ${FILE_STORAGE_MAX_SIZE_BYTES:-10485760}
  # Escaneo antimalware APAGADO de forma explícita (TX-33): en Coolify no corre
  # `worker-files` ni clamd, así que ninguna versión pasa a SCAN_CLEAN. Las lecturas
  # por contexto (resultado del paciente, documento del expediente) no lo exigen;
  # la URL firmada sí y responde 422 `details.reason = SCAN_PENDING`. Encenderlo
  # exige sumar `clamav` y `worker-files` (ver docker-compose.yml).
  MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
  FILE_STORAGE_S3_BUCKET: ${MINIO_BUCKET:-alovida-files}
  FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-us-east-1}
  FILE_STORAGE_S3_ENDPOINT: http://minio:9000
  FILE_STORAGE_S3_FORCE_PATH_STYLE: "true"
  # Prefijo propio de los archivos: `audio-assets` es el del módulo de audio y no
  # se comparte (TX-34).
  FILE_STORAGE_S3_PREFIX: ${FILE_STORAGE_S3_PREFIX:-uploads}
  FILE_STORAGE_S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
  FILE_STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}

  # --- Secretos. LOS CUATRO son obligatorios con NODE_ENV=production ------
  JWT_SECRET: ${JWT_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
  WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY}
  DOWNLOAD_URL_SECRET: ${DOWNLOAD_URL_SECRET}
  # La quinta, y la que no se ve venir: se exige con la síntesis de voz apagada.
  AUDIO_TTS_DATA_KEY: ${AUDIO_TTS_DATA_KEY}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  ACCOUNT_LOCK_THRESHOLD: ${ACCOUNT_LOCK_THRESHOLD:-5}

  # Número de proxies de confianza delante de la API. En este despliegue son
  # dos: el Traefik de Coolify y el nginx del frontend. Sin esto, Express toma
  # la IP del último salto —siempre la misma— y el limitador de tasa mete a
  # todos los usuarios en el mismo cubo de 300 peticiones/minuto: con una
  # decena de pantallas abiertas empiezan los 429 sin que nadie entienda por
  # qué. Es un número y no `true` a propósito: confiar en toda la cadena deja
  # que cualquiera falsifique su IP con una cabecera `X-Forwarded-For`.
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}

  # --- Primer administrador ----------------------------------------------
  # `BOOTSTRAP_ADMIN_ALLOW_PRODUCTION` tiene que ser `true` explícito o el seed
  # se salta en producción y no queda NINGUNA cuenta con SECURITY_ADMIN: sin
  # ella, `POST /iam/users` es inalcanzable y no hay forma de crear el primer
  # usuario por API. Dejarlo en `true` para el arranque en frío y volverlo a
  # `false` cuando el administrador ya exista.
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  BOOTSTRAP_ADMIN_ALLOW_PRODUCTION: ${BOOTSTRAP_ADMIN_ALLOW_PRODUCTION:-false}
  # Cuentas de demostración de socios comerciales. Apagadas: en un servidor real
  # son cuatro credenciales conocidas.
  SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
  SEED_DEMO_ALLOW_PRODUCTION: ${SEED_DEMO_ALLOW_PRODUCTION:-false}

  # --- Postura de seguridad ----------------------------------------------
  # Cookie httpOnly del refresh (TX-10). Se enciende junto con PUBLIC_REFRESH_COOKIE
  # del front (docs/progress/DECISIONS.md, D-I): con un solo lado la sesión se pierde.
  AUTH_REFRESH_COOKIE_ENABLED: ${AUTH_REFRESH_COOKIE_ENABLED:-false}
  AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-redesa_refresh}
  AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/iam/auth/token/refresh}
  AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-strict}
  # Desafío MFA en el login para cuentas con factor verificado (TX-29). Apagado.
  AUTH_MFA_CHALLENGE_ENABLED: ${AUTH_MFA_CHALLENGE_ENABLED:-false}
  AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-true}
  RLS_ENFORCE: ${RLS_ENFORCE:-false}
  # El bypass de verificación aborta el arranque si llega en `true` con
  # NODE_ENV=production; se deja escrito para que nadie lo herede de un `.env`.
  DEV_VERIFICATION_BYPASS: "false"
  MIKRO_ORM_DEBUG: "false"

  # --- Esquema y siembra: los hace `api-migrate`, no el proceso que sirve --
  ORM_SCHEMA_SYNC: "off"
  # Con `off`, `SchemaBootstrapService` retorna antes de comparar nada, así que
  # esta variable no hace efecto en la API: quien verifica la fidelidad es
  # `api-migrate`, y lo hace en CADA despliegue porque es un paso obligatorio
  # del arranque del stack. Se deja declarada para que el día que alguien
  # cambie el modo en un incidente, la comprobación venga incluida.
  ORM_VERIFY_FIDELITY: "true"
  SEED_ON_BOOT: "false"

  # --- Workers ------------------------------------------------------------
  WORKER_API_BASE_URL: http://api:3000
  WORKER_HTTP_TIMEOUT_MS: ${WORKER_HTTP_TIMEOUT_MS:-30000}
  WORKER_HEALTH_PORT: "9100"
  WORKER_TICK_TIMEOUT_MS: ${WORKER_TICK_TIMEOUT_MS:-300000}
  WORKER_STUCK_TICK_MS: ${WORKER_STUCK_TICK_MS:-600000}
  WORKER_DRAIN_TIMEOUT_MS: ${WORKER_DRAIN_TIMEOUT_MS:-20000}
  WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
  WORKER_HTTP_RETRY_ATTEMPTS: ${WORKER_HTTP_RETRY_ATTEMPTS:-3}
  WORKER_HTTP_MAX_CONCURRENT: ${WORKER_HTTP_MAX_CONCURRENT:-16}
  MESSAGING_QUEUE_CODES: ${MESSAGING_QUEUE_CODES:-}
  # VACÍA, y es una condición de arranque: ver el punto 6 de la cabecera.
  MOCK_PROVIDER_BASE_URL: ""

  # --- Plazos HTTP --------------------------------------------------------
  # `keepAlive` por encima del idle timeout del proxy que va delante, o
  # aparecen 502 esporádicos sin rastro en los logs de la aplicación.
  API_SHUTDOWN_TIMEOUT_MS: ${API_SHUTDOWN_TIMEOUT_MS:-30000}
  HTTP_KEEPALIVE_TIMEOUT_MS: ${HTTP_KEEPALIVE_TIMEOUT_MS:-65000}
  HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-70000}
  HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-120000}

  # --- Correo real (Gmail API). Vacías = el envío queda sin proveedor -----
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
  GOOGLE_SENDER_EMAIL: ${GOOGLE_SENDER_EMAIL:-}

  # --- Audio / TTS --------------------------------------------------------
  # El único subsistema que puede COSTAR DINERO por ejecución, y por eso lleva
  # tres interruptores en serie en vez de uno: `AUDIO_TTS_ENABLED` monta el
  # módulo, `AUDIO_TTS_ALLOW_RUNTIME_GENERATION` permite generar audio nuevo
  # durante la operación (apagado, solo se sirve lo ya cacheado), y
  # `AUDIO_TTS_PROD_LICENSE_CONFIRMED` exige que alguien haya mirado la
  # licencia de la voz antes de locutar en producción. Con cualquiera de los
  # tres en falso, `AudioBudgetPolicy` deniega y lo dice por su nombre
  # (`TTS_DISABLED`, `RUNTIME_GENERATION_DISABLED`,
  # `PRODUCTION_LICENSE_NOT_CONFIRMED`) — no revienta nada.
  #
  # La lista es larga a propósito. Compose NO inyecta el `.env` dentro de los
  # contenedores: una variable que no figure en este bloque no existe ahí
  # dentro por más que esté puesta en Coolify. Faltaban las veintidós de abajo
  # —`ELEVENLABS_VOICE_ID` entre ellas—, así que elegir la voz no tenía ningún
  # efecto y el proveedor recibía una referencia vacía.
  AUDIO_TTS_ENABLED: ${AUDIO_TTS_ENABLED:-false}
  AUDIO_TTS_PROVIDER: ${AUDIO_TTS_PROVIDER:-disabled}
  AUDIO_TTS_ALLOW_RUNTIME_GENERATION: ${AUDIO_TTS_ALLOW_RUNTIME_GENERATION:-false}
  AUDIO_TTS_PROD_LICENSE_CONFIRMED: ${AUDIO_TTS_PROD_LICENSE_CONFIRMED:-false}
  # Identidad de la voz. Los cinco entran en la clave de la caché: tocar
  # cualquiera invalida lo ya locutado y hay que volver a pagarlo.
  AUDIO_TTS_DEFAULT_LANGUAGE: ${AUDIO_TTS_DEFAULT_LANGUAGE:-es-419}
  AUDIO_TTS_DEFAULT_FORMAT: ${AUDIO_TTS_DEFAULT_FORMAT:-mp3_44100_128}
  AUDIO_TTS_SAMPLE_RATE: ${AUDIO_TTS_SAMPLE_RATE:-44100}
  AUDIO_TTS_VOICE_PROFILE: ${AUDIO_TTS_VOICE_PROFILE:-brand_es_latam_v1}
  AUDIO_TTS_VOICE_VERSION: ${AUDIO_TTS_VOICE_VERSION:-1}
  AUDIO_TTS_MODEL: ${AUDIO_TTS_MODEL:-eleven_v3}
  # Presupuesto. La reserva de seguridad por encima del techo mensual bloquea
  # la generación entera: es el freno de mano. El tope por actor y día impide
  # que una sola cuenta —o un botón pulsado en bucle— se coma el mes; `0` lo
  # deja SIN tope por actor, no en cero.
  AUDIO_TTS_MONTHLY_BUDGET_UNITS: ${AUDIO_TTS_MONTHLY_BUDGET_UNITS:-10000}
  AUDIO_TTS_SAFETY_RESERVE_UNITS: ${AUDIO_TTS_SAFETY_RESERVE_UNITS:-1000}
  AUDIO_TTS_RUNTIME_GENERATIONS_PER_ACTOR_DAY: ${AUDIO_TTS_RUNTIME_GENERATIONS_PER_ACTOR_DAY:-3}
  # Plazos, reintentos y cortacircuitos del proveedor.
  AUDIO_TTS_REQUEST_TIMEOUT_MS: ${AUDIO_TTS_REQUEST_TIMEOUT_MS:-10000}
  AUDIO_TTS_MAX_RETRIES: ${AUDIO_TTS_MAX_RETRIES:-3}
  AUDIO_TTS_HTTP_MAX_RETRIES: ${AUDIO_TTS_HTTP_MAX_RETRIES:-0}
  AUDIO_TTS_RETRY_BASE_MS: ${AUDIO_TTS_RETRY_BASE_MS:-500}
  AUDIO_TTS_MAX_CONCURRENCY: ${AUDIO_TTS_MAX_CONCURRENCY:-2}
  AUDIO_TTS_MAX_REQUESTS_PER_SECOND: ${AUDIO_TTS_MAX_REQUESTS_PER_SECOND:-2}
  AUDIO_TTS_CB_FAILURE_THRESHOLD: ${AUDIO_TTS_CB_FAILURE_THRESHOLD:-5}
  AUDIO_TTS_CB_OPEN_MS: ${AUDIO_TTS_CB_OPEN_MS:-30000}
  AUDIO_TTS_CB_HALF_OPEN_MAX_CALLS: ${AUDIO_TTS_CB_HALF_OPEN_MAX_CALLS:-1}
  AUDIO_TTS_CROSS_TEMPLATE_DEDUP: ${AUDIO_TTS_CROSS_TEMPLATE_DEDUP:-true}
  AUDIO_TTS_GLOBAL_FALLBACK_TEMPLATE: ${AUDIO_TTS_GLOBAL_FALLBACK_TEMPLATE:-onboarding.fallback.generic}
  AUDIO_TTS_GC_RETENTION_DAYS: ${AUDIO_TTS_GC_RETENTION_DAYS:-90}
  # Proveedor. `ELEVENLABS_VOICE_ID` no tiene valor por omisión a propósito:
  # elegir la voz es una decisión de marca, no algo que se hereda.
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_v3}
  ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
  ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}

  # --- Trazas -------------------------------------------------------------
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-alovida}
  OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}

x-api-resources: &api-resources
  limits:
    cpus: "2.0"
    memory: 1536M

x-worker-resources: &worker-resources
  limits:
    cpus: "0.5"
    memory: 384M

x-worker-healthcheck: &worker-healthcheck
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://localhost:9100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
    ]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s

# Plantilla de los 22 workers: misma imagen que la API, mismo entorno, y lo
# único que cambia es el `command`. Se fusiona con `<<:` para no repetir
# veintidós veces catorce líneas idénticas — repetidas, un cambio se aplica a
# veintiuno y se olvida en el que nadie mira.
x-worker: &worker
  image: ${API_IMAGE:-alovida-api:coolify}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_COMMIT: ${SOURCE_COMMIT:-desconocido}
      APP_VERSION: ${APP_VERSION:-desconocido}
  restart: always
  environment:
    <<: *app-env
  deploy:
    resources: *worker-resources
  healthcheck: *worker-healthcheck
  # Por encima de WORKER_SHUTDOWN_TIMEOUT_MS (30 s): el drenaje del tick en
  # vuelo tiene que terminar antes del SIGKILL, o cada despliegue corta lotes
  # a la mitad y nadie deja escrito qué quedó pendiente.
  stop_grace_period: 45s
  depends_on:
    api:
      condition: service_healthy
  networks:
    - alovida

services:
  # =======================================================================
  # MOTORES DE DATOS
  # =======================================================================
  postgres:
    image: timescale/timescaledb-ha:pg18
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Puerto PUBLICADO EN EL HOST para que los testers de datos entren desde
    # fuera con un cliente SQL. Es la ÚNICA base del stack que se expone: Mongo,
    # Redis, OpenSearch y MinIO siguen solo en la red interna `alovida`.
    # Postgres exige contraseña (scram-sha-256) a toda conexión que no sea
    # local, así que el rol `alovida` NO se comparte: a los testers se les da
    # el rol de solo lectura de `scripts/postgres/provision-roles.sql`.
    # Cambiar a `127.0.0.1:5432:5432` para volver a cerrarlo y entrar por
    # túnel SSH. Ver docs/operations/coolify.md § 7.
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      # `timescaledb-ha` usa PGDATA=/home/postgres/pgdata/data, NO la ruta de la
      # imagen oficial de postgres. Montado en /var/lib/postgresql/data el
      # volumen queda vacío y los datos viven en la capa efímera del contenedor:
      # se pierden enteros en el primer redespliegue.
      - postgres_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - alovida

  # One-shot: aplica el DDL canónico versionado en `database/`.
  postgres-init:
    # El DDL y el script van HORNEADOS, no montados. Ver el punto 7 de la
    # cabecera y `docker/db-init/Dockerfile`: en Coolify un bind del
    # repositorio llega vacío y esto moría con `exit 127`.
    image: ${DB_INIT_PG_IMAGE:-alovida-postgres-init:coolify}
    build:
      context: .
      dockerfile: docker/db-init/Dockerfile
      target: postgres-init
    restart: "no"
    entrypoint: ["bash", "/init/bin/init-postgres.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alovida

  mongodb:
    image: mongo:8.2.12
    restart: always
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 40s
    networks:
      - alovida

  mongo-init:
    # Horneado, igual que `postgres-init`. Ver el punto 7 de la cabecera.
    image: ${DB_INIT_MONGO_IMAGE:-alovida-mongo-init:coolify}
    build:
      context: .
      dockerfile: docker/db-init/Dockerfile
      target: mongo-init
    restart: "no"
    entrypoint: ["bash", "/init/bin/init-mongo.sh"]
    environment:
      MONGO_DB: ${MONGO_DB:-alovida_document_store}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - alovida

  redis:
    image: redis:8.10-alpine
    restart: always
    # `--save 60 1` conserva el snapshot: Redis guarda el estado del limitador
    # de tasa y de las colas, y perderlo en cada reinicio del contenedor no es
    # gratis.
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alovida

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    restart: always
    environment:
      - cluster.name=alovida-cluster
      - node.name=alovida-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # Sin plugin de seguridad porque OpenSearch NO se publica: solo lo
      # alcanzan los contenedores de esta red. Si algún día se le pone dominio,
      # esto tiene que cambiar antes.
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - alovida

  opensearch-init:
    # Horneado, igual que `postgres-init`. Ver el punto 7 de la cabecera.
    image: ${DB_INIT_OS_IMAGE:-alovida-opensearch-init:coolify}
    build:
      context: .
      dockerfile: docker/db-init/Dockerfile
      target: opensearch-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init/bin/init-opensearch.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - alovida

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - alovida

  # One-shot que NO existe en el compose de desarrollo, y por eso hacía falta:
  # ningún punto del código crea el bucket (no hay un solo `CreateBucketCommand`
  # en `src/`). Contra un MinIO recién levantado, la primera subida de audio o
  # de archivo por S3 muere con `NoSuchBucket` — y el worker lo registra como
  # fallo de proveedor, que manda a buscar el problema donde no está.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set alovida http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "alovida/$$MINIO_BUCKET"
        echo "=== minio-init: bucket $$MINIO_BUCKET listo"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-alovida-files}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - alovida

  # =======================================================================
  # PASO DE MIGRACIÓN. Ver el punto 2 de la cabecera.
  # =======================================================================
  # Corre `seed-cli`, que construye el contexto de Nest sin servidor HTTP: eso
  # dispara `onApplicationBootstrap` —y con él `SchemaBootstrapService` en modo
  # `safe`— y después siembra el catálogo, terminando con un código de salida
  # que dice si algo falló. Ese código es lo que hace que `api` NO arranque
  # contra una base a medio construir: `service_completed_successfully`.
  api-migrate:
    image: ${API_IMAGE:-alovida-api:coolify}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${SOURCE_COMMIT:-desconocido}
        APP_VERSION: ${APP_VERSION:-desconocido}
    restart: "no"
    command: ["node", "dist/src/seed-cli.js"]
    environment:
      <<: *app-env
      # Las dos únicas diferencias con el resto del stack, y son el motivo de
      # que este servicio exista.
      ORM_SCHEMA_SYNC: "safe"
      ORM_VERIFY_FIDELITY: "true"
    deploy:
      resources: *api-resources
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - alovida

  # =======================================================================
  # API
  # =======================================================================
  api:
    image: ${API_IMAGE:-alovida-api:coolify}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${SOURCE_COMMIT:-desconocido}
        BUILD_TIME: ${BUILD_TIME:-desconocido}
        APP_VERSION: ${APP_VERSION:-desconocido}
    restart: always
    command: ["node", "dist/src/main.js"]
    environment:
      <<: *app-env
    deploy:
      resources: *api-resources
    volumes:
      - api_storage:/app/storage
    # Sin `ports:`. Quien entra desde fuera es el nginx del frontend, por la red
    # `alovida`. Para exponer la API con dominio propio, ponerle uno en Coolify
    # a este servicio: Coolify añade las etiquetas de Traefik solo.
    expose:
      - "3000"
    stop_grace_period: 45s
    healthcheck:
      # `node:24-bookworm-slim` no trae curl ni wget: se usa el `fetch` nativo
      # de Node en vez de engordar la imagen por un healthcheck.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    networks:
      alovida:
        # El nginx del frontend resuelve `http://api:3000`. Coolify renombra los
        # contenedores, así que el alias se declara explícito en vez de confiar
        # en que el nombre del servicio sobreviva al renombrado.
        aliases:
          - api
          - alovida-api

  # =======================================================================
  # WORKERS ESENCIALES
  # Mensajería entrega los correos (activación de cuenta incluida), y sin
  # planificación ni flujos de trabajo la agenda y los procesos clínicos no
  # avanzan solos. Estos cuatro son los que se notan apagados el primer día.
  # =======================================================================
  worker-messaging:
    <<: *worker
    command: ["node", "dist/src/worker-messaging.js"]

  worker-scheduling:
    <<: *worker
    command: ["node", "dist/src/worker-scheduling.js"]

  worker-workflow:
    <<: *worker
    command: ["node", "dist/src/worker-workflow.js"]

  worker-read_models:
    <<: *worker
    command: ["node", "dist/src/worker-read_models.js"]

  # =======================================================================
  # WORKERS OPCIONALES — APAGADOS EN COOLIFY, A PROPÓSITO
  #
  # Estaban acá los dieciocho workers de dominio, y salieron por dos razones
  # que empujan en la misma dirección.
  #
  # **Coolify no puede desplegar un compose de este tamaño.** Escribe el
  # archivo en el servidor mandándolo en base64 dentro de UN argumento de
  # shell, y Linux corta un argumento en 131 072 bytes (`MAX_ARG_STRLEN`).
  # Con los veintidós workers, este compose expandido por Coolify pesaba
  # 217 KB —289 KB en base64—, así que el despliegue moría siempre en el
  # mismo paso, «Failed to write deployment configurations», antes de clonar
  # el repositorio. No es un fallo intermitente ni de red: es determinista, y
  # reintentar no lo arregla. Las aplicaciones de ATLAS, que sí despliegan,
  # tienen composes de entre 2,6 y 26 KB.
  #
  # **Y no entrarían en memoria.** Cada worker reserva 384 MB; dieciocho son
  # 6,9 GB de reserva sobre un VPS que ya está usando swap al completo.
  #
  # Es la salida que este mismo archivo proponía para un VPS chico. Lo que se
  # detiene es el procesamiento en segundo plano de cada dominio; la API, el
  # alta de pacientes, el directorio público y el resto del uso sincrónico
  # funcionan sin ellos. Los cuatro esenciales de arriba siguen en pie.
  #
  # Para recuperarlos hay que partir el stack en varias aplicaciones de
  # Coolify —una por grupo de workers—, no volver a pegarlos acá.
  # =======================================================================

# -------------------------------------------------------------------------
# Volúmenes. Son lo único del stack que no se puede reconstruir: Coolify
# recrea contenedores en cada despliegue y los datos tienen que sobrevivir.
# -------------------------------------------------------------------------
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  opensearch_data:
  minio_data:
  api_storage:

# -------------------------------------------------------------------------
# Red compartida con el stack del frontend.
#
# La crea ESTE stack —sin `external`— con un nombre fijo, y el frontend la toma
# como `external`. Es la única combinación que funciona sin tocar el servidor a
# mano: dos `external` exigen crearla antes por SSH, y dos no-`external`
# chocan por el nombre.
#
# La contrapartida, que hay que saber: si este stack se destruye, la red se va
# con él y el nginx del frontend deja de resolver `api` hasta el siguiente
# despliegue de este lado.
# -------------------------------------------------------------------------
networks:
  alovida:
    name: ${ALOVIDA_NETWORK:-alovida}
