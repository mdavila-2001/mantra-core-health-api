# -------------------------------------------------------------------------
# Volúmenes. Son lo único del stack que no se puede reconstruir: Coolify
# recrea contenedores en cada despliegue y los datos tienen que sobrevivir.
# -------------------------------------------------------------------------
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  opensearch_data:
  minio_data:
  api_storage:

# -------------------------------------------------------------------------
# Red compartida con el stack del frontend. Crear UNA VEZ en el servidor:
#
#     docker network create alovida
#
# Externa en los dos lados: si uno la creara, el otro fallaría al arrancar con
# «network alovida was found but has incorrect label».
# -------------------------------------------------------------------------
networks:
  alovida:
    external: true
    name: ${ALOVIDA_NETWORK:-alovida}
