# =========================================================================
# Mantra Core Technologies
# Product: REDESA Health Ecosystem
# Footprint: Infrastructure Configuration (desarrollo local)
# -------------------------------------------------------------------------
# Portabilidad (Mac / Windows / Linux):
#   - Todas las credenciales y puertos salen de .env (copiar de .env.example).
#     Postgres se siembra con las MISMAS variables que usa la app (DB_*), así
#     no hay dos juegos de credenciales que mantener sincronizados.
#   - La persistencia usa VOLÚMENES NOMBRADOS gestionados por Docker: funcionan
#     igual en cualquier SO y evitan los problemas de permisos/rutas de los
#     bind-mounts de base de datos en Windows/macOS. Los datos sobreviven a
#     `docker compose down` y a reinicios. Para borrarlos: `docker compose down -v`.
#     Para relocalizar a una carpeta del host, ver el bloque comentado al final.
#   - Los scripts de docker/db-init/*.sh DEBEN quedar con fin de línea LF; eso lo
#     garantiza .gitattributes (`*.sh text eol=lf`) para los que trabajan en Windows.
# =========================================================================
name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}

# Entorno compartido por la API y los 20 procesos worker (un dominio cada
# uno — ver `PLAN-CORRECCION-WORKERS-2026-07-28.md`). `x-app-env` es una
# extension field (Compose la ignora como servicio; solo sirve de ancla YAML)
# para no repetir 20 veces el mismo bloque. Los host/puerto son los nombres de
# servicio DENTRO de la red de compose (no los `*_PORT` expuestos al host, que
# son solo para conectarse desde fuera de Docker).
x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_NAME: ${POSTGRES_DB}
  MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-mantra_redesa_health_document_store}
  MONGO_DB: ${MONGO_DB:-mantra_redesa_health_document_store}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  OPENSEARCH_NODE: http://opensearch:9200
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-mantra-redesa-health-files}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  ACCOUNT_LOCK_THRESHOLD: ${ACCOUNT_LOCK_THRESHOLD:-5}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
  RLS_ENFORCE: ${RLS_ENFORCE:-false}
  MIKRO_ORM_DEBUG: ${MIKRO_ORM_DEBUG:-false}
  # Los 20 workers llaman la API por el nombre del servicio, no localhost.
  WORKER_API_BASE_URL: http://api:3000
  WORKER_HTTP_TIMEOUT_MS: ${WORKER_HTTP_TIMEOUT_MS:-30000}
  MESSAGING_QUEUE_CODES: ${MESSAGING_QUEUE_CODES:-}
  TS_COMPRESSION_OLDER_THAN: ${TS_COMPRESSION_OLDER_THAN:-7 days}
  TS_ROLLUP_REFRESH_WINDOW_HOURS: ${TS_ROLLUP_REFRESH_WINDOW_HOURS:-2}
  # Vacío por defecto a propósito: retención de time_series es opt-in por
  # tabla (ver `apply-retention.job.ts`). Formato: "tabla=intervalo,..."
  TS_RETENTION_POLICIES: ${TS_RETENTION_POLICIES:-}
  # Emulador standalone (`../mock-provider-server`) de los proveedores
  # externos que el backend no conecta de verdad todavía: mensajería,
  # borrado cross-store y embeddings. Configurado por DEFECTO (no opt-in):
  # el adapter real de cada job cae solo al stub "PROVIDER_NOT_CONFIGURED"
  # si esta URL queda vacía. Ver `worker/worker.env.ts` y
  # `mock-provider-server/README.md`.
  MOCK_PROVIDER_BASE_URL: ${MOCK_PROVIDER_BASE_URL:-http://mock-provider-server:4100}
  MOCK_PROVIDER_API_KEY: ${MOCK_PROVIDER_API_KEY:-}

# Límites de recursos: sin esto, un proceso Node con un memory leak o un tick
# de worker atascado puede consumir toda la RAM del host sin que nada lo
# frene. Son defaults conservadores para desarrollo/staging, no una medición
# de carga real de producción — ajustar con datos reales antes de operar así.
x-api-resources: &api-resources
  limits:
    cpus: "2.0"
    memory: 1536M
x-worker-resources: &worker-resources
  limits:
    cpus: "0.5"
    memory: 512M

services:
  postgres:
    image: timescale/timescaledb-ha:pg18
    restart: always
    environment:
      # Variables nativas del contenedor. Deben coincidir con DB_* que usa la app.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  # One-shot: aplica SQL/ (apply_all → apply_deferred) y los stores PG de
  # NoSQL/ (58 TimescaleDB, 59 pgvector) solo si las tablas no existen.
  postgres-init:
    image: timescale/timescaledb-ha:pg18
    restart: "no"
    entrypoint: ["bash", "/init/bin/init-postgres.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/SQL:/init/SQL:ro
      - ./database/NoSQL:/init/NoSQL:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  mongodb:
    image: mongo:8.0
    restart: always
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  # One-shot: crea las colecciones del módulo 55 document_store
  # (validadores $jsonSchema + índices) solo si no existen.
  mongo-init:
    image: mongo:8.0
    restart: "no"
    entrypoint: ["bash", "/init/bin/init-mongo.sh"]
    environment:
      MONGO_DB: ${MONGO_DB:-salud_document_store}
    volumes:
      - ./database/NoSQL/55_document_store_mongodb:/init/mongo:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  redis:
    image: redis:8.8-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    restart: always
    environment:
      - cluster.name=mantra-redesa-cluster
      - node.name=mantra-redesa-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9201}:9200"
      - "${OPENSEARCH_MONITOR_PORT:-9601}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mantra-redesa-network

  # One-shot: crea los índices del módulo 57 search_platform desde los
  # *.mapping.json solo si no existen.
  opensearch-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    entrypoint: ["/bin/sh", "/init/bin/init-opensearch.sh"]
    volumes:
      - ./database/NoSQL/57_search_platform_opensearch:/init/os:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  minio:
    # Última release de MinIO community con consola de administración completa.
    # RELEASE.2025-05-24 en adelante reduce la consola a un navegador de objetos
    # y el proyecto fue archivado en 2026 — no actualizar más allá de esta versión.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  # -----------------------------------------------------------------------
  # Emulador standalone de proveedores externos (proyecto NestJS
  # independiente en `../mock-provider-server`, sin código ni dependencias
  # compartidas con el backend principal). `messaging`, `cross_store_consistency`
  # y `vector_rag` le apuntan por defecto vía `MOCK_PROVIDER_BASE_URL` (arriba)
  # para poder ejercitar sus workers de punta a punta sin credenciales reales
  # de vendor. Se puede levantar también suelto (`yarn start:dev` dentro de
  # esa carpeta) sin este compose — ver su README.
  # -----------------------------------------------------------------------
  mock-provider-server:
    image: mantra-redesa-mock-provider-server:local
    build:
      context: ./mock-provider-server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: "4100"
      MOCK_API_KEY: ${MOCK_PROVIDER_API_KEY:-}
      NOTIFICATIONS_FAILURE_RATE: ${MOCK_NOTIFICATIONS_FAILURE_RATE:-0.1}
      DELETIONS_FAILURE_RATE: ${MOCK_DELETIONS_FAILURE_RATE:-0.05}
      SIMULATED_LATENCY_MS: ${MOCK_SIMULATED_LATENCY_MS:-50}
    ports:
      - "${MOCK_PROVIDER_PORT:-4100}:4100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4100/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  # -----------------------------------------------------------------------
  # API + workers. Misma imagen para los 20 (build una sola vez; el
  # `command` es lo único que cambia). Cada worker es SU PROPIO proceso/
  # contenedor — no un único monolito con los 20 dominios adentro — para que
  # un fallo o un pico de carga en uno no toque a los demás, y cada uno
  # escale por separado. Ver `PLAN-CORRECCION-WORKERS-2026-07-28.md`.
  # -----------------------------------------------------------------------
  api:
    image: mantra-redesa-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["node", "dist/src/main.js"]
    environment:
      <<: *app-env
    deploy:
      resources: *api-resources
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - api_storage:/app/storage
    healthcheck:
      # Sin curl/wget en `node:24-bookworm-slim`: se usa el `fetch` nativo de
      # Node en vez de instalar un paquete extra sólo para el healthcheck.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # No basta con que Postgres esté healthy: `TerminologySeedService`
      # corre en `onApplicationBootstrap` y necesita el esquema ya aplicado
      # (`postgres-init`), o la API arranca contra una base sin tablas en un
      # `docker compose up` desde cero. Mismo razonamiento para Mongo/OpenSearch:
      # document_store/search_platform asumen sus colecciones/índices creados.
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  worker-billing:
    image: mantra-redesa-api:local
    build:
      context: .
