# =========================================================================
# Mantra Core Technologies
# Product: REDESA Health Ecosystem
# Footprint: Infrastructure Configuration (desarrollo local)
# -------------------------------------------------------------------------
# Portabilidad (Mac / Windows / Linux):
#   - Todas las credenciales y puertos salen de .env (copiar de .env.example).
#     Postgres se siembra con las MISMAS variables que usa la app (DB_*), así
#     no hay dos juegos de credenciales que mantener sincronizados.
#   - La persistencia usa VOLÚMENES NOMBRADOS gestionados por Docker: funcionan
#     igual en cualquier SO y evitan los problemas de permisos/rutas de los
#     bind-mounts de base de datos en Windows/macOS. Los datos sobreviven a
#     `docker compose down` y a reinicios. Para borrarlos: `docker compose down -v`.
#     Para relocalizar a una carpeta del host, ver el bloque comentado al final.
#   - Los scripts de docker/db-init/*.sh DEBEN quedar con fin de línea LF; eso lo
#     garantiza .gitattributes (`*.sh text eol=lf`) para los que trabajan en Windows.
# =========================================================================
name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}

services:
  postgres:
    image: timescale/timescaledb-ha:pg18
    restart: always
    environment:
      # Sembrado desde las variables de la app: una sola fuente de verdad.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  # One-shot: aplica SQL/ (apply_all → apply_deferred) y los stores PG de
  # NoSQL/ (58 TimescaleDB, 59 pgvector) solo si las tablas no existen.
  # Las rutas de origen son configurables por si el árbol SQL/NoSQL vive fuera
  # del repo (cada dev las ajusta en .env — SQL_INIT_DIR / NOSQL_INIT_DIR).
  postgres-init:
    image: timescale/timescaledb-ha:pg18
    restart: "no"
    entrypoint: ["bash", "/init/bin/init-postgres.sh"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${SQL_INIT_DIR:-./database/SQL}:/init/SQL:ro
      - ${NOSQL_INIT_DIR:-./database/NoSQL}:/init/NoSQL:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  mongodb:
    image: mongo:8.0
    restart: always
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  # One-shot: crea las colecciones del módulo 55 document_store
  # (validadores $jsonSchema + índices) solo si no existen.
  mongo-init:
    image: mongo:8.0
    restart: "no"
    entrypoint: ["bash", "/init/bin/init-mongo.sh"]
    environment:
      MONGO_DB: ${MONGO_DB:-salud_document_store}
    volumes:
      - ${NOSQL_INIT_DIR:-./database/NoSQL}/55_document_store_mongodb:/init/mongo:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  redis:
    image: redis:8.8-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    restart: always
    environment:
      - cluster.name=mantra-redesa-cluster
      - node.name=mantra-redesa-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9201}:9200"
      - "${OPENSEARCH_MONITOR_PORT:-9601}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mantra-redesa-network

  # One-shot: crea los índices del módulo 57 search_platform desde los
  # *.mapping.json solo si no existen.
  opensearch-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    entrypoint: ["/bin/sh", "/init/bin/init-opensearch.sh"]
    volumes:
      - ${NOSQL_INIT_DIR:-./database/NoSQL}/57_search_platform_opensearch:/init/os:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  minio:
    # Última release de MinIO community con consola de administración completa.
    # RELEASE.2025-05-24 en adelante reduce la consola a un navegador de objetos
    # y el proyecto fue archivado en 2026 — no actualizar más allá de esta versión.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

# -------------------------------------------------------------------------
# Volúmenes de datos (persistentes, gestionados por Docker).
# Los nombres llevan el prefijo del proyecto para no colisionar con otros
# stacks en la misma máquina. Para inspeccionar: `docker volume ls`.
#
# ¿Quieres los datos en una carpeta concreta del host en lugar del área de
# Docker? Descomenta driver/driver_opts en el volumen deseado y crea la carpeta
# (en Windows usa una ruta tipo //c/Users/tu-usuario/redesa-data/postgres):
#
#   postgres_data:
#     name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_postgres_data
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: ${POSTGRES_DATA_DIR:-./data/postgres}
# -------------------------------------------------------------------------
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_postgres_data
  mongodb_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_mongodb_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_redis_data
  opensearch_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_opensearch_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_minio_data

networks:
  mantra-redesa-network:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}-network
