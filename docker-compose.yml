# -------------------------------------------------------------------------
# Volúmenes de datos (persistentes, gestionados por Docker).
# Los nombres llevan el prefijo del proyecto para no colisionar con otros
# stacks en la misma máquina. Para inspeccionar: `docker volume ls`.
#
# ¿Quieres los datos en una carpeta concreta del host en lugar del área de
# Docker? Descomenta driver/driver_opts en el volumen deseado y crea la carpeta
# (en Windows usa una ruta tipo //c/Users/tu-usuario/alovida-data/postgres):
#
#   postgres_data:
#     name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_postgres_data
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: ${POSTGRES_DATA_DIR:-./data/postgres}
# -------------------------------------------------------------------------
volumes:
  # `FileStorageModule` sólo tiene el adaptador local en disco hoy (MinIO está
  # provisionado pero sin un `S3FileStorageAdapter` que lo use — ver
  # `src/common/storage/README.md`); hasta que exista ese adaptador, sin este
  # volumen cada `docker compose up`/redeploy recrea el contenedor `api` con
  # `storage/uploads` vacío y los archivos subidos se pierden.
  api_storage:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_api_storage
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_postgres_data
  mongodb_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_mongodb_data
  # Base de firmas de ClamAV: sin volumen, cada recreación del contenedor
  # vuelve a descargar ~300 MiB antes de poder escanear nada.
  clamav_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_clamav_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_redis_data
  opensearch_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_opensearch_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}_minio_data

networks:
  mantra-redesa-network:
    name: ${COMPOSE_PROJECT_NAME:-mantra-redesa}-network
