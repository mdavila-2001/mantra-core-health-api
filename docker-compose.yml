# Product: REDESA Health Ecosystem
# Footprint: Infrastructure Configuration
# =========================================================================
name: mantra-redesa

services:
  postgres:
    image: timescale/timescaledb-ha:pg18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  # One-shot: aplica SQL/ (apply_all → apply_deferred) y los stores PG de
  # NoSQL/ (58 TimescaleDB, 59 pgvector) solo si las tablas no existen.
  postgres-init:
    image: timescale/timescaledb-ha:pg18
    container_name: postgres-init
    restart: "no"
    entrypoint: ["bash", "/init/bin/init-postgres.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../SQL:/init/SQL:ro
      - ../NoSQL:/init/NoSQL:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  # One-shot: crea las colecciones del módulo 55 document_store
  # (validadores $jsonSchema + índices) solo si no existen.
  mongo-init:
    image: mongo:8.0
    container_name: mongo-init
    restart: "no"
    entrypoint: ["bash", "/init/bin/init-mongo.sh"]
    environment:
      MONGO_DB: ${MONGO_DB:-salud_document_store}
    volumes:
      - ../NoSQL/55_document_store_mongodb:/init/mongo:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  redis:
    image: redis:8.8-alpine
    container_name: redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: opensearch
    restart: always
    environment:
      - cluster.name=mantra-redesa-cluster
      - node.name=mantra-redesa-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9201:9200"
      - "9601:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mantra-redesa-network

  # One-shot: crea los índices del módulo 57 search_platform desde los
  # *.mapping.json solo si no existen.
  opensearch-init:
    image: curlimages/curl:8.11.1
    container_name: opensearch-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init/bin/init-opensearch.sh"]
    volumes:
      - ../NoSQL/57_search_platform_opensearch:/init/os:ro
      - ./docker/db-init:/init/bin:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - mantra-redesa-network

  minio:
    # Última release de MinIO community con consola de administración completa.
    # RELEASE.2025-05-24 en adelante reduce la consola a un navegador de objetos
    # y el proyecto fue archivado en 2026 — no actualizar más allá de esta versión.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantra-redesa-network

volumes:
  postgres_data:
    name: postgres_data
  mongodb_data:
    name: mongodb_data
  redis_data:
    name: redis_data
  opensearch_data:
    name: opensearch_data
  minio_data:
    name: minio_data

networks:
  mantra-redesa-network:
    name: mantra-redesa-network